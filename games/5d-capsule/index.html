<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>扭一扭！5D 課堂抽籤機</title>
<style>
:root{
  --ink:#2a241c;
  --yellow:#ffd84a;
  --yellow-deep:#f0b000;
  --cream:#fff8e4;
  --red:#ff4b4b;
  --red-deep:#c81e1e;
  --paper:#fffdf7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100svh;
  color:var(--ink);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:
    radial-gradient(900px 480px at 8% -10%,#fff8c4,transparent 60%),
    radial-gradient(760px 420px at 110% 0%,#fff0a4,transparent 55%),
    linear-gradient(180deg,#fff6cf 0%,#ffe15a 46%,#ffcf3a 100%);
}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
[hidden]{display:none!important}
.app{min-height:100svh;position:relative;display:flex;flex-direction:column}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fffdf6;border-radius:40px;height:26px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fffdf6;border-radius:50%}
.c1{width:130px;top:11%;left:7%}
.c1::before{width:52px;height:52px;top:-30px;left:20px}
.c1::after{width:36px;height:36px;top:-18px;left:58px}
.c2{width:100px;top:16%;right:8%}
.c2::before{width:42px;height:42px;top:-24px;left:14px}
.c2::after{width:30px;height:30px;top:-14px;left:46px}
.bolt{position:absolute;width:36px;height:54px;filter:drop-shadow(2px 3px 0 #e6b000)}
.b1{left:5%;bottom:12%;width:28px}
.b2{right:6%;top:18%;transform:rotate(16deg)}
.b3{left:16%;top:8%;width:22px;opacity:.55}
.b4{right:18%;bottom:8%;width:26px;opacity:.45}
.header{position:relative;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;letter-spacing:1px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:4px 4px 0 var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.small{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.small:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.title,.status{
  position:relative;
  z-index:5;
  width:min(560px,calc(100% - 32px));
  margin:0 auto;
  text-align:center;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:28px;
  box-shadow:8px 8px 0 var(--ink);
  padding:14px 16px 16px;
}
.title p{margin:4px 0 0;font-size:13px;letter-spacing:3px;font-weight:800}
.title h1{margin:6px 0 0;font-size:clamp(28px,4vw,40px);line-height:1.25;color:var(--red-deep)}
.title h1 span{display:block;margin-top:4px;color:var(--ink);font-size:.62em;letter-spacing:2px}
.star{display:flex;justify-content:center}
.scene{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;pointer-events:none;min-height:260px;padding:8px 0 12px}
.scene-frame{position:relative;width:min(440px,88vw,calc((100svh - 240px)*.75));aspect-ratio:720/960}
.stage-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;user-select:none}
.knob-hit{position:absolute;left:71%;top:56.5%;width:24%;height:22%;border-radius:50%;padding:0;background:transparent;pointer-events:auto}
body[data-state=idle] .knob-hit,body[data-state=revealed] .knob-hit{cursor:pointer}
body[data-state=setup] .knob-hit{pointer-events:none}
.knob-rotation{transform-box:view-box;transform-origin:600px 660px}
body[data-state=idle] .knob-rotation{animation:hintturn 2.6s ease-in-out infinite}
.spinning .knob-rotation{animation:turn 1.4s cubic-bezier(.2,.75,.2,1)}
.bounce-ball{transform-box:fill-box;transform-origin:center}
.spinning .bounce-ball{animation:bounce .22s ease-in-out infinite alternate}
.spinning .bounce-ball:nth-child(2n){animation-duration:.28s;animation-delay:.08s}
.spinning .bounce-ball:nth-child(3n){animation-duration:.18s}
.bulb{fill:#fffef6;stroke:var(--ink);stroke-width:3}
.bulb:nth-child(odd){fill:var(--red)}
body[data-state=spinning] .bulb{animation:blink .18s infinite alternate}
body[data-state=spinning] .bulb:nth-child(even){animation-delay:.09s}
body[data-state=spinning] .cheek{animation:pulse .18s infinite alternate}
body[data-state=spinning] .bolt{animation:flicker .14s infinite alternate}
.setup-wrap{position:relative;z-index:7;width:min(560px,94vw);margin:0 auto 20px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:20px;box-shadow:8px 8px 0 var(--ink)}
.setup-title{margin:0 0 14px;font-size:22px}
.tabs{display:flex;gap:6px;background:#ffe7a3;padding:5px;border-radius:18px;border:3px solid var(--ink)}
.tab{flex:1;padding:10px 8px;border-radius:13px;font-weight:900}
.tab.active{background:var(--paper);color:var(--red-deep);box-shadow:0 3px 0 #e6c56a}
.label{display:block;margin:14px 0 8px;font-weight:900}
textarea{width:100%;height:150px;border-radius:16px;border:3px solid var(--ink);padding:12px;line-height:1.7;font-size:17px;resize:vertical;color:var(--ink);background:white}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;margin:8px 0 12px}
.link{color:var(--red-deep);font-weight:900;text-decoration:underline}
.check{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--red-deep)}
.error{color:#a10f2b;font-size:14px;font-weight:800;min-height:1.2em;margin:8px 0}
.primary{border-radius:999px;padding:14px 28px;background:linear-gradient(#ff6d6d,var(--red-deep));color:white;font-weight:900;font-size:22px;border:4px solid var(--ink);box-shadow:0 6px 0 #8d1818;transition:transform .12s,box-shadow .12s}
.primary:hover:not(:disabled){transform:translateY(-2px)}
.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #8d1818}
.panel .primary{width:100%;font-size:20px}
.hint{font-size:12px;text-align:center;margin:12px 0 0;line-height:1.6}
.status h2{font-size:clamp(22px,2.4vw,34px);line-height:1.35;margin:8px 0}
.pill{display:inline-block;background:var(--yellow);border:3px solid var(--ink);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:900}
.history{margin:10px auto 0;font-size:13px;line-height:1.8;font-weight:800}
.history span{display:inline-block;background:#fff4c2;border:2px solid var(--ink);padding:1px 8px;border-radius:999px;margin:3px;max-width:100%;overflow-wrap:anywhere}
#play{position:fixed;inset:0;z-index:4;pointer-events:none}
.play-controls{position:absolute;z-index:8;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,560px);text-align:center;pointer-events:auto}
#instruction{font-size:18px;font-weight:900;background:var(--paper);border:3px solid var(--ink);display:table;margin:0 auto 10px;padding:8px 16px;border-radius:999px;box-shadow:4px 4px 0 var(--ink)}
#draw{min-width:240px;pointer-events:auto}
.reveal-layer{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#fff3c200;transition:background .3s}
.capsule-btn{position:absolute;width:clamp(220px,34vw,360px);height:clamp(220px,34vw,360px);left:50%;top:44%;transform:translate(-50%,-50%);padding:0;background:none;border:0;pointer-events:auto;filter:drop-shadow(0 18px 0 #e0a41a)}
.capsule-btn svg{width:100%;height:100%;overflow:visible}
.top,.bottom{transform-box:view-box;transform-origin:60px 60px;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .65s}
.opened .top{transform:translate(-16px,-74px) rotate(-26deg);opacity:0}
.opened .bottom{transform:translate(14px,74px) rotate(18deg);opacity:0}
.drop{animation:arrival .7s cubic-bezier(.18,.8,.22,1.08)}
.ready{animation:wiggle 1.15s ease-in-out infinite}
.capsule-btn.ready::after{content:"";position:absolute;inset:-8%;border:4px dashed var(--ink);border-radius:50%;animation:spinring 6s linear infinite;pointer-events:none}
.result{z-index:6;max-width:min(86vw,920px);max-height:min(52svh,calc(100svh - 210px));overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:clamp(48px,8vw,112px);line-height:1.25;font-weight:900;color:var(--ink);padding:28px 36px;border:6px solid var(--ink);border-radius:36px;background:var(--paper);box-shadow:12px 12px 0 var(--yellow);opacity:0;pointer-events:none;transition:opacity .35s,transform .45s}
.result.long{font-size:clamp(28px,4.6vw,64px)}
body[data-state=ready] .reveal-layer,body[data-state=revealed] .reveal-layer{background:#fff1c4d4;backdrop-filter:blur(5px)}
.result{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.82)}
body[data-state=revealed] .result{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
body[data-state=setup] .status,body[data-state=setup] .play-controls{display:none}
body[data-state=idle] .title,body[data-state=spinning] .title{display:none}
body[data-state=ready] .status,body[data-state=revealed] .status{opacity:0;pointer-events:none}
.confetti{position:fixed;top:42%;left:50%;width:12px;height:18px;pointer-events:none;z-index:10;border-radius:3px;animation:confetti 1.15s ease-out forwards}
@keyframes turn{to{transform:rotate(720deg)}}
@keyframes hintturn{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(16deg)}}
@keyframes bounce{to{transform:translateY(-52px)}}
@keyframes blink{to{fill:#ffe14a}}
@keyframes pulse{to{opacity:.45}}
@keyframes flicker{to{opacity:.25}}
@keyframes arrival{from{transform:translate(-50%,90%) scale(.18);opacity:.2}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:translate(-50%,-50%) rotate(-7deg)}50%{transform:translate(-50%,-50%) rotate(7deg)}}
@keyframes spinring{to{transform:rotate(360deg)}}
@keyframes confetti{to{transform:translate(var(--x),var(--y)) rotate(280deg);opacity:0}}
@media(min-height:900px){textarea{height:210px}}
@media(min-width:1100px){
  body,.app{height:100svh;overflow:hidden}
  .app{display:block}
  .scene{position:absolute;inset:76px 0 8px;padding:0}
  .scene-frame{width:min(680px,34vw,calc((100svh - 96px)*.75))}
  .title{position:absolute;left:max(16px,2vw);top:16vh;width:min(270px,22vw);margin:0;text-align:left}
  .title .star{justify-content:flex-start}
  .title h1{font-size:clamp(32px,2.6vw,52px)}
  .status{position:absolute;left:max(16px,2vw);top:16vh;width:min(290px,24vw);margin:0;text-align:left;max-height:58vh;overflow:auto}
  .setup-wrap{position:absolute;right:max(16px,2vw);top:11vh;width:min(420px,31vw);max-height:calc(100svh - 14vh);overflow:auto;margin:0}
  .play-controls{left:auto;right:max(16px,2vw);top:50%;bottom:auto;transform:translateY(-50%);width:min(340px,28vw)}
  body[data-state=ready] .play-controls,body[data-state=revealed] .play-controls{left:50%;right:auto;top:auto;bottom:3vh;transform:translateX(-50%);width:min(440px,46vw)}
  .result{left:50%;max-width:min(78vw,860px)}
  #draw{width:100%;min-height:76px;font-size:28px}
  #instruction{font-size:20px}
  .history{margin-left:0}
}
@media(min-width:900px) and (max-width:1099px){
  body,.app{height:100svh;overflow:hidden}
  .app{display:block}
  .scene{position:absolute;inset:68px 0 8px;padding:0}
  .scene-frame{width:min(360px,34vw,calc((100svh - 110px)*.75))}
  .title{position:absolute;left:12px;top:78px;width:min(210px,24vw);margin:0;text-align:left;box-shadow:6px 6px 0 var(--ink)}
  .title .star{justify-content:flex-start}
  .status{position:absolute;left:12px;top:78px;transform:none;width:min(220px,26vw);text-align:left;max-height:50vh;overflow:auto}
  .status h2{display:block;font-size:22px;margin:8px 0 0}
  .history{display:block}
  .setup-wrap{position:absolute;right:12px;top:72px;width:min(320px,34vw);max-height:calc(100svh - 88px);overflow:auto;margin:0}
  .play-controls{left:auto;right:12px;top:50%;bottom:auto;transform:translateY(-50%);width:min(280px,32vw)}
  body[data-state=ready] .play-controls,body[data-state=revealed] .play-controls{left:50%;right:auto;top:auto;bottom:12px;transform:translateX(-50%);width:min(420px,70vw)}
  #draw{width:100%}
}
@media(max-width:899px){
  body:not([data-state=setup]) .title{display:none}
  body[data-state=setup] .scene{flex:0;min-height:0;padding:0}
  body[data-state=setup] .scene-frame{width:min(220px,58vw)}
  body[data-state=setup] .title{padding:8px 12px;margin-bottom:4px}
  body[data-state=setup] .title h1{font-size:24px;margin-top:2px}
  body[data-state=setup] .setup-wrap{margin:4px auto 8px}
  body:not([data-state=setup]) .scene{padding:64px 0 128px}
  .scene-frame{width:min(460px,84vw,calc((100svh - 230px)*.75))}
  .status{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center;box-shadow:5px 5px 0 var(--ink);padding:8px 14px}
  .status h2{display:inline;font-size:20px;margin:0 0 0 8px}
  .history{display:none}
  textarea{height:120px}
  .panel{padding:16px}
}
@media(max-width:700px){
  .header{padding:10px 12px;align-items:flex-start}
  .brand,.small{font-size:13px;padding:7px 10px}
  .tools{max-width:230px}
  .title h1{font-size:26px}
  .panel{padding:16px}
  .capsule-btn{width:230px;height:230px}
  #instruction{font-size:15px}
  .result{padding:22px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

        <text x="343" y="820" text-anchor="middle" font-family="PingFang TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="900" fill="#2a241c">小驚喜出口</text>
        <ellipse cx="248" cy="868" rx="64" ry="26" fill="#ffe14a" stroke="#2a241c" stroke-width="6"/>
        <ellipse cx="248" cy="882" rx="46" ry="14" fill="#2a241c"/>
        <ellipse cx="438" cy="868" rx="64" ry="26" fill="#ffe14a" stroke="#2a241c" stroke-width="6"/>
        <ellipse cx="438" cy="882" rx="46" ry="14" fill="#2a241c"/>
        <g class="knob-rotation">
          <circle cx="600" cy="660" r="64" fill="url(#knobGrad)" stroke="#2a241c" stroke-width="7"/>

          <polygon points="600,586 592,610 602,610 594,632 614,606 604,606 612,586" fill="#ff4b4b" stroke="#2a241c" stroke-width="2" stroke-linejoin="round"/>
          <line x1="548" y1="660" x2="566" y2="660" stroke="#2a241c" stroke-width="5" stroke-linecap="round"/>
          <line x1="634" y1="660" x2="652" y2="660" stroke="#2a241c" stroke-width="5" stroke-linecap="round"/>
          <line x1="600" y1="698" x2="600" y2="714" stroke="#2a241c" stroke-width="5" stroke-linecap="round"/>
          <circle cx="600" cy="660" r="16" fill="#2a241c"/>
          <circle cx="600" cy="654" r="5" fill="#fff6dc"/>
        </g>
        <g font-family="PingFang TC,Microsoft JhengHei,sans-serif">
          <rect x="546" y="736" width="108" height="34" rx="17" fill="#fff8e4" stroke="#2a241c" stroke-width="4"/>
          <text x="600" y="759" text-anchor="middle" font-size="16" font-weight="900" fill="#2a241c">轉這裡</text>
        </g>
      </svg>
      <button type="button" class="knob-hit" id="knob" aria-label="轉動扭蛋機旋鈕" tabindex="-1"></button>
    </div>
  </div>
  <section class="setup-wrap panel" id="setup">
    <h2 class="setup-title">準備一點小驚喜 ✨</h2>
    <div class="tabs" role="group" aria-label="抽籤模式">
      <button type="button" class="tab active" id="names" aria-pressed="true">☺ 抽名字</button>
      <button type="button" class="tab" id="questions" aria-pressed="false">? 抽題目</button>
    </div>
    <label class="label" for="entries" id="inputlabel">誰來一起玩？</label>
    <textarea id="entries" maxlength="10000" spellcheck="false" placeholder="每行輸入一個名字&#10;例如：1 陳芊穎&#10;2 陳俊熹">1 陳芊穎
2 陳俊熹
3 陳彥博
4 朱凱恩
5 黃鍶泳
6 黃天合
7 葉嘉舜

17 黃棹嵐
18 黃棹瑤

    <div class="meta"><span>每行一項 · 最多 100 項</span><button type="button" class="link" id="sample">載入 5D 名單</button></div>
    <label class="check"><input type="checkbox" id="unique" checked>不重複抽取</label>
    <p class="error" id="error" role="alert"></p>
    <button type="button" class="primary" id="start">開始扭蛋 →</button>
    <p class="hint">已預設 5D 班 27 位學生（學號＋姓名），可自行增減；重新整理後會回復預設名單。</p>
  </section>
  <section id="play" hidden>
    <div class="status">
      <span class="pill" id="remaining"></span>
      <h2 id="heading">這次輪到誰？</h2>
      <div class="history" id="history"></div>
    </div>
    <div class="reveal-layer">
      <button type="button" class="capsule-btn" id="capsule" hidden aria-label="打開扭蛋">
        <svg viewBox="0 0 120 120">
          <g class="top">
            <path d="M30 38L38 10L50 34Z" fill="#ffe566" stroke="#2a241c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M36 18L38 10L42 18Z" fill="#2a241c"/>
            <path d="M70 34L82 10L90 38Z" fill="#ffe566" stroke="#2a241c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M78 18L82 10L84 16Z" fill="#2a241c"/>
            <path d="M10 60a50 50 0 0 1 100 0Z" fill="#ffe14a" stroke="#2a241c" stroke-width="4"/>
            <path d="M28 44q14-16 28-12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
          </g>
          <g class="bottom">
            <path d="M10 60a50 50 0 0 0 100 0Z" fill="#fff6dc" stroke="#2a241c" stroke-width="4"/>
            <path d="M12 60h96" stroke="#ff4b4b" stroke-width="8" stroke-linecap="round"/>
            <circle cx="42" cy="82" r="7" fill="#ff4b4b"/>
            <circle cx="78" cy="82" r="7" fill="#ff4b4b"/>
            <polygon points="60,70 53,84 63,84 55,98 73,80 63,80 70,70" fill="#ffd84a" stroke="#2a241c" stroke-width="2" stroke-linejoin="round"/>
          </g>
        </svg>
      </button>
      <div class="result" id="result" role="status" aria-live="polite">準備好了嗎？</div>
    </div>
    <div class="play-controls">
      <p id="instruction">按一下，讓小驚喜滾出來！</p>
      <button type="button" class="primary" id="draw">扭一扭！ ✦</button>
    </div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
let mode='names',items=[],pool=[],past=[],phase='setup',chosen='',timer=null,sound=false,audio=null;
const DEFAULT_NAMES='1 陳芊穎\n2 陳俊熹\n3 陳彥博\n4 朱凱恩\n5 黃鍶泳\n6 黃天合\n7 葉嘉舜\n8 黎柏謙\n9 林千洋\n10 林芷穎\n11 梁竣然\n12 李淳謙\n13 文希宸\n14 顏鳳儀\n15 鄧展楓\n16 鄧鈞灝\n17 黃棹嵐\n18 黃棹瑤\n19 黃靖熙\n20 黃宸一\n21 黃芯玥\n22 黃溢楠\n23 王堯希\n24 胡景雲\n25 夏天\n26 余樂熹\n27 袁千喬';
const SAMPLE_QUESTIONS='你最喜歡哪種動物？\n今天有甚麼開心的事？\n說出三種水果。\n如果你會飛，你想去哪裏？\n介紹一個你喜歡的遊戲。';
const drafts={names:DEFAULT_NAMES,questions:''};
const colors=['#ff4b4b','#2a241c','#fffef8','#ff8c1a','#e6a100'];

function setMode(next){
  drafts[mode]=$('entries').value;
  mode=next;
  $('entries').value=drafts[mode];
  for(const id of ['names','questions']){
    $(id).classList.toggle('active',id===mode);
    $(id).setAttribute('aria-pressed',String(id===mode));
  }
  $('inputlabel').textContent=mode==='names'?'誰來一起玩？':'今天想問甚麼？';
  $('entries').placeholder=mode==='names'?'每行輸入一個名字\n例如：小晴\n小樂\n小希':'每行輸入一道題目\n例如：你最喜歡哪種動物？';
  $('error').textContent='';
}
$('names').onclick=()=>setMode('names');
$('questions').onclick=()=>setMode('questions');
$('sample').onclick=()=>{
  $('entries').value=mode==='names'?DEFAULT_NAMES:SAMPLE_QUESTIONS;
  $('error').textContent='';
};
function beep(){
  if(!sound)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    audio.resume();
    [523,659,784].forEach((f,i)=>{
      const o=audio.createOscillator(),g=audio.createGain();
      o.connect(g);g.connect(audio.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0,audio.currentTime+i*.09);
      g.gain.linearRampToValueAtTime(.07,audio.currentTime+i*.09+.01);
      g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.09+.25);
      o.start(audio.currentTime+i*.09);
      o.stop(audio.currentTime+i*.09+.26);
    });
  }catch{}
}
$('sound').onclick=()=>{
  sound=!sound;
  $('sound').textContent=`音效：${sound?'開':'關'}`;
  $('sound').setAttribute('aria-pressed',String(sound));
  if(sound)beep();
};
function update(){
  const n=$('unique').checked?pool.length:items.length;
  $('remaining').textContent=$('unique').checked?`還有 ${n} ${mode==='names'?'個名字':'道題目'}`:`共 ${n} 項 · 可以重複抽取`;
  $('history').replaceChildren();
  if(past.length){
    $('history').append(document.createTextNode('剛剛抽到：'));
    past.slice(-5).forEach(v=>{
      const s=document.createElement('span');
      s.textContent=v;
      $('history').append(s);
    });
  }
}
function reset(){
  document.body.dataset.state='idle';
  clearTimeout(timer);
  pool=[...items];
  past=[];
  phase='idle';
  $('stage').classList.remove('spinning');
  $('capsule').hidden=true;
  $('capsule').className='capsule-btn';
  $('result').classList.remove('long');
  $('heading').textContent=mode==='names'?'這次輪到誰？':'這次抽到甚麼題目？';
  $('result').textContent='準備好了嗎？';
  $('instruction').textContent='按一下，讓小驚喜滾出來！';
  $('draw').textContent='扭一扭！ ✦';
  $('draw').disabled=false;
  $('edit').disabled=false;
  $('reset').disabled=false;
  $('knob').setAttribute('tabindex','0');
  update();
}
$('start').onclick=()=>{
  const list=$('entries').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let msg='';
  if(!list.length)msg='先輸入名字或題目，才可以開始喔！';
  else if(list.length>100)msg='一次最多 100 項，請減少一些內容。';
  else if(new Set(list).size!==list.length)msg='有相同的項目，請加上編號或修改，讓每一項都不一樣。';
  if(msg){$('error').textContent=msg;return}
  items=list;
  drafts[mode]=$('entries').value;
  $('setup').hidden=true;
  $('play').hidden=false;
  $('edit').hidden=false;
  $('reset').hidden=false;
  reset();
  $('draw').focus();
};
function draw(){
  if(!['idle','revealed'].includes(phase))return;
  if($('unique').checked&&!pool.length){reset();return}
  phase='spinning';
  document.body.dataset.state='spinning';
  $('draw').disabled=true;
  $('edit').disabled=true;
  $('reset').disabled=true;
  $('capsule').hidden=true;
  $('capsule').className='capsule-btn';
  $('result').textContent='咕嚕、咕嚕…';
  $('instruction').textContent='小驚喜正在路上！';
  $('stage').classList.add('spinning');
  const source=$('unique').checked?pool:items;
  const n=Math.floor(Math.random()*source.length);
  chosen=source[n];
  if($('unique').checked)pool.splice(n,1);
  timer=setTimeout(()=>{
    $('stage').classList.remove('spinning');
    $('capsule').hidden=false;
    $('capsule').classList.add('drop');
    phase='ready';
    document.body.dataset.state='ready';
    $('result').textContent='驚喜藏在裏面！';
    $('instruction').textContent='點一下扭蛋，揭曉答案！';
    $('draw').textContent='打開扭蛋！';
    $('draw').disabled=false;
    $('capsule').focus();
    timer=setTimeout(()=>{
      $('capsule').classList.remove('drop');
      $('capsule').classList.add('ready');
    },700);
  },1400);
}
function reveal(){
  if(phase!=='ready')return;
  phase='revealed';
  document.body.dataset.state='revealed';
  clearTimeout(timer);
  $('capsule').classList.remove('ready','drop');
  $('capsule').classList.add('opened');
  $('result').textContent=chosen;
  $('result').classList.toggle('long',chosen.length>12);
  past.push(chosen);
  update();
  $('edit').disabled=false;
  $('reset').disabled=false;
  const done=$('unique').checked&&!pool.length;
  $('instruction').textContent=done?'全部抽完了！再來一輪嗎？':mode==='names'?'輪到你了！':'想一想，再分享你的答案。';
  $('draw').textContent=done?'重新開始 ↻':'再扭一次！';
  beep();
  const spread=Math.min(window.innerWidth*.75,1100);
  for(let i=0;i<28;i++){
    const c=document.createElement('i');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    if(i%3===0)c.style.borderRadius='50%';
    c.style.setProperty('--x',`${(Math.random()-.5)*spread}px`);
    c.style.setProperty('--y',`${Math.random()*Math.min(window.innerHeight*.5,420)-140}px`);
    document.body.append(c);
    setTimeout(()=>c.remove(),1200);
  }
}
$('draw').onclick=()=>phase==='ready'?reveal():draw();
$('capsule').onclick=reveal;
$('knob').onclick=draw;
$('reset').onclick=reset;
$('edit').onclick=()=>{
  clearTimeout(timer);
  phase='setup';
  document.body.dataset.state='setup';
  $('play').hidden=true;
  $('setup').hidden=false;
  $('edit').hidden=true;
  $('reset').hidden=true;
  $('capsule').hidden=true;
  $('knob').setAttribute('tabindex','-1');
  $('entries').focus();
};
</script>
