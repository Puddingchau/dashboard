    const n = normalizeEvent(ev);
    if (ev.from != null || ev.to != null || ev.date !== n.date || ev.time !== n.time || (ev.work || '') !== n.work) dirty = true;
    return n;
  });

  const filter = normalizeEventsFilter(state.eventsFilter);
  const visible = sortEventsNearestFirst(
    state.events.filter(ev => eventInFilter(ev, filter))
  );

/* ===== Month calendar ===== */
const CAL_WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
let calView = (function () {
  const t = todayLocal();
  return { year: t.getFullYear(), month: t.getMonth() }; // month 0-11
})();
let calSelectedYMD = toYMD(todayLocal());

function countMarksInViewMonth() {
  const y = calView.year;
  const m = calView.month;
  const days = new Set();
  (state.events || []).forEach(function (e) {
    const d = parseDateOnly(e.date);
    if (d && d.getFullYear() === y && d.getMonth() === m) days.add(d.getDate());
  });
  (state.todos || []).forEach(function (t) {
    if (t.done) return;
    const d = parseDateOnly(t.due);
    if (d && d.getFullYear() === y && d.getMonth() === m) days.add(d.getDate());
  });
  return days.size;
}

function marksForYMD(ymd) {
  const events = (state.events || []).filter(function (e) { return e.date === ymd; });
  const todos = (state.todos || []).filter(function (t) {
    if (t.done) return false;
    const d = parseDateOnly(t.due);
    return d && toYMD(d) === ymd;
  });
  return { events: events, todos: todos };
}

function shiftCalMonth(delta) {
  let m = calView.month + delta;
  let y = calView.year;
  while (m < 0) { m += 12; y -= 1; }
  while (m > 11) { m -= 12; y += 1; }
  calView = { year: y, month: m };
  renderCalendar();
  updateBlockSummaries();
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const label = document.getElementById('calMonthLabel');
  if (!grid || !label) return;

  const y = calView.year;
  const m = calView.month;
  label.textContent = y + '年' + (m + 1) + '月';

  const first = new Date(y, m, 1);
  const startDow = first.getDay(); // Sun=0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const todayYMD = toYMD(todayLocal());

  const cells = [];
  // Leading days from previous month
  for (let i = 0; i < startDow; i++) {
    const day = prevDays - startDow + 1 + i;
    const d = new Date(y, m - 1, day);
    cells.push({ date: d, other: true });
  }
  for (let day = 1; day <= daysInMonth; day++) {
    cells.push({ date: new Date(y, m, day), other: false });
  }
  // Trailing to fill weeks (up to 6 rows)
  while (cells.length % 7 !== 0) {
    const day = cells.length - startDow - daysInMonth + 1;
    cells.push({ date: new Date(y, m + 1, day), other: true });
  }
  while (cells.length < 42) {
    const last = cells[cells.length - 1].date;
    const next = new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1);
    cells.push({ date: next, other: true });
  }

  grid.innerHTML = cells.map(function (cell) {
    const ymd = toYMD(cell.date);
    const dow = cell.date.getDay();
    const marks = marksForYMD(ymd);
    const hasE = marks.events.length > 0;
    const hasT = marks.todos.length > 0;
    const cls = [
      'cal-day',
      cell.other ? 'other-month' : '',
      ymd === todayYMD ? 'today' : '',
      ymd === calSelectedYMD ? 'selected' : '',
      dow === 0 ? 'sun' : '',
      dow === 6 ? 'sat' : ''
    ].filter(Boolean).join(' ');
    let dots = '';
    if (hasE) dots += '<span class="cal-dot event" title="活動"></span>';
    if (hasT) dots += '<span class="cal-dot todo" title="To-Do"></span>';
    return (
      '<button type="button" class="' + cls + '" data-ymd="' + escapeHtml(ymd) + '" aria-label="' + escapeHtml(ymd) + '">' +
        '<span class="cal-day-num">' + cell.date.getDate() + '</span>' +
        '<span class="cal-dots">' + dots + '</span>' +
      '</button>'
    );
  }).join('');

  grid.querySelectorAll('.cal-day').forEach(function (btn) {
    btn.addEventListener('click', function () {
      calSelectedYMD = btn.getAttribute('data-ymd');
      renderCalendar();
    });
  });

  renderCalDayPanel();
}

function renderCalDayPanel() {
  const panel = document.getElementById('calDayPanel');
  const title = document.getElementById('calDayPanelTitle');
  const items = document.getElementById('calDayItems');
  if (!panel || !title || !items) return;
  if (!calSelectedYMD) {
    panel.hidden = true;
    return;
  }
  const d = parseDateOnly(calSelectedYMD);
  const marks = marksForYMD(calSelectedYMD);
  title.textContent = d
    ? (d.getMonth() + 1) + '月' + d.getDate() + '日（' + CAL_WEEKDAYS[d.getDay()] + '）'
    : calSelectedYMD;
  panel.hidden = false;

  const rows = [];
  marks.events.forEach(function (e) {
    rows.push(
      '<div class="cal-day-item">' +
        '<span class="cal-tag event">活動</span>' +
        '<div class="cal-item-text">' + escapeHtml(e.title || '（無標題）') +
          (e.time ? '<span class="cal-item-meta">' + escapeHtml(e.time) + '</span>' : '') +
        '</div>' +
      '</div>'
    );
  });
  marks.todos.forEach(function (t) {
    rows.push(
      '<div class="cal-day-item">' +
        '<span class="cal-tag todo">To-Do</span>' +
        '<div class="cal-item-text">' + escapeHtml(t.title || '（無標題）') + '</div>' +
      '</div>'
    );
  });
  if (!rows.length) {
    items.innerHTML = '<div class="cal-empty">當日暫無活動或待辦</div>';
  } else {
    items.innerHTML = rows.join('');
  }
}

function bindCalendarControls() {
  const prev = document.getElementById('calPrev');
  const next = document.getElementById('calNext');
  const todayBtn = document.getElementById('calToday');
  if (prev) prev.addEventListener('click', function () { shiftCalMonth(-1); });
  if (next) next.addEventListener('click', function () { shiftCalMonth(1); });
  if (todayBtn) todayBtn.addEventListener('click', function () {
    const t = todayLocal();
    calView = { year: t.getFullYear(), month: t.getMonth() };
    calSelectedYMD = toYMD(t);
    renderCalendar();
    updateBlockSummaries();
  });
}

function busSummaryLine(b) {
  const parts = [
    b.route || '—',
    b.direction || '',
    b.stopName || '未設定站名',
    b.stopId || ''
  ].filter(function (p, i) {
    return i === 0 || (p && String(p).trim());
  });
  return parts.join(' · ');
}

function formatEtaMinutes(etaIso) {
  if (!etaIso) return null;
  const t = new Date(etaIso).getTime();
  if (!Number.isFinite(t)) return null;
  const now = Date.now();
  const diffMs = t - now;
  const mins = Math.round(diffMs / 60000);
  if (diffMs <= 45000 || mins <= 0) return '即將到達';
  if (mins < 60) return mins + ' 分鐘';
  try {
    return new Intl.DateTimeFormat('zh-HK', {
      timeZone: 'Asia/Hong_Kong',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(new Date(etaIso));
  } catch (e) {
    const d = new Date(etaIso);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
}

function filterStopEtaRows(rows, bus) {
  const route = String(bus.route || '').trim().toUpperCase();
  if (!route) return [];
  const keywords = resolveBusDestKeywords(bus);
  const apiDir = resolveBusApiDir(bus);
  const filtered = (rows || []).filter(function (row) {
    if (!row || String(row.route || '').toUpperCase() !== route) return false;
    const dest = String(row.dest_tc || '');
    const destOk = keywords.length > 0 && keywords.some(function (k) { return dest.indexOf(k) !== -1; });
    const dirOk = apiDir && String(row.dir || '').toUpperCase() === apiDir;
    return destOk || dirOk;
  }).filter(function (row) {
    return row.eta != null && String(row.eta).trim() !== '';
  }).sort(function (a, b) {
    const ta = new Date(a.eta).getTime();
    const tb = new Date(b.eta).getTime();
    if (ta !== tb) return ta - tb;
    // Prefer normal service_type when ETAs tie across variants
    return (Number(a.service_type) || 99) - (Number(b.service_type) || 99);
  });
  // stop-eta returns one row per service_type; identical clocks would all render as 「即將到達」
  const seen = {};
  const unique = [];
  filtered.forEach(function (row) {
    const key = String(row.eta).trim();
    if (seen[key]) return;
    seen[key] = true;
    unique.push(row);
  });
  return unique.slice(0, 3);
}

function formatBusEtaHtml(bus, stopPayload) {
  const stopId = resolveStopApiId(bus);
  if (!stopId) {
    const op = resolveBusOperator(bus);
    return { html: op === 'CTB' ? '未設定城巴站點' : '未設定 KMB 站點 ID', cls: 'is-error' };
  }
  if (!stopPayload) {
    return { html: '載入中…', cls: 'is-loading' };
  }
  if (stopPayload.error) {
    return { html: '無法取得到站時間', cls: 'is-error' };
  }
  const matched = filterStopEtaRows(stopPayload.rows, bus);
  if (!matched.length) {
    return { html: '暫時沒有班次', cls: '' };
  }
  // Card list: only the next bus (第一班)
  const next = matched[0];
  const label = formatEtaMinutes(next.eta);
  if (!label) {
    return { html: '暫時沒有班次', cls: '' };
  }
  let html = '<span class="eta-times">' + escapeHtml(label) + '</span>';
  const rmk = String(next.rmk_tc || '').trim();
  if (rmk) {
    html += '<span class="eta-rmk">（' + escapeHtml(rmk) + '）</span>';
  }
  return { html: html, cls: '' };
}

function setBusEtaEl(el, bus, stopPayload) {
  if (!el) return;
  const result = formatBusEtaHtml(bus, stopPayload);
  el.classList.remove('is-loading', 'is-error');

async function mapPool(items, concurrency, fn) {
  const list = items || [];
  const results = new Array(list.length);
  let cursor = 0;
  async function worker() {
    while (true) {
      const idx = cursor++;
      if (idx >= list.length) return;
      results[idx] = await fn(list[idx], idx);
    }
  }
  const n = Math.max(1, Math.min(concurrency || 6, list.length || 1));
  const workers = [];
  for (let i = 0; i < n; i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

const CTB_STOP_CACHE_KEY = 'ctb-stops-cache-v1';
const CTB_STOP_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
const CTB_ROUTE_STOP_CACHE_KEY = 'ctb-route-stop-cache-v1';
const CTB_ROUTE_STOP_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
const CTB_ROUTE_LIST_CACHE_KEY = 'ctb-route-list-cache-v1';
const CTB_ROUTE_LIST_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
/** @type {Record<string, {id:string,n:string,lat:number,lng:number}>} */
let ctbStopsById = {};
/** @type {Record<string, {at:number, stops: {seq:number, stop:string}[]}>} */
let ctbRouteStopMem = {};
/** @type {any[]|null} */
let ctbRouteListMem = null;

function readCtbStopDiskCache() {
  try {
    const raw = localStorage.getItem(CTB_STOP_CACHE_KEY);
    if (!raw) return { at: 0, map: {} };
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return { at: 0, map: {} };
    const map = {};
    (parsed.data || []).forEach(function (s) {
      if (s && s.id) map[s.id] = s;
    });
    return { at: Number(parsed.at) || 0, map: map };
  } catch (e) {
    return { at: 0, map: {} };
  }
}

function writeCtbStopDiskCache(map) {
  try {
    const compact = Object.keys(map).map(function (id) { return map[id]; });
    localStorage.setItem(CTB_STOP_CACHE_KEY, JSON.stringify({ at: Date.now(), data: compact }));
  } catch (e) { /* quota */ }
}

async function fetchCtbStopDetail(stopId) {
  const sid = String(stopId || '').trim();
  if (!sid) return null;
  if (ctbStopsById[sid] && Number.isFinite(ctbStopsById[sid].lat)) return ctbStopsById[sid];
  const disk = readCtbStopDiskCache();
  if (disk.map[sid] && Number.isFinite(disk.map[sid].lat) && (Date.now() - disk.at) < CTB_STOP_CACHE_TTL_MS) {
    ctbStopsById[sid] = disk.map[sid];
    return ctbStopsById[sid];
  }
  const url = CTB_ETA_BASE + '/stop/' + encodeURIComponent(sid);
  const res = await fetch(url, { cache: 'default' });
  if (!res.ok) throw new Error('CTB stop HTTP ' + res.status);
  const json = await res.json();
  const d = json && json.data;
  if (!d || !d.stop) return null;
  const lat = parseFloat(d.lat);
  const lng = parseFloat(d.long);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  const entry = { id: String(d.stop), n: String(d.name_tc || d.name_en || ''), lat: lat, lng: lng };
  ctbStopsById[sid] = entry;
  disk.map[sid] = entry;
  writeCtbStopDiskCache(disk.map);
  return entry;
}

async function ensureCtbStopsMap(stopIds) {
  const ids = [];
  const seen = {};
  (stopIds || []).forEach(function (id) {
    const s = String(id || '').trim();
    if (!s || seen[s]) return;
    seen[s] = true;
    ids.push(s);
  });
  // hydrate from disk first
  const disk = readCtbStopDiskCache();
  if ((Date.now() - disk.at) < CTB_STOP_CACHE_TTL_MS) {
    Object.keys(disk.map).forEach(function (id) {
      if (!ctbStopsById[id]) ctbStopsById[id] = disk.map[id];
    });
  }
  const missing = ids.filter(function (id) {
    return !(ctbStopsById[id] && Number.isFinite(ctbStopsById[id].lat));
  });
  if (missing.length) {
    await mapPool(missing, 8, async function (id) {
      try { await fetchCtbStopDetail(id); } catch (e) { /* skip */ }
      return id;
    });
  }
  return ctbStopsById;
}

async function fetchCtbRouteStops(route, apiDir) {
  const r = String(route || '').trim().toUpperCase();
  const bound = apiDirToBoundPath(apiDir);
  const key = r + '|' + bound;
  const now = Date.now();
  if (ctbRouteStopMem[key] && (now - ctbRouteStopMem[key].at) < CTB_ROUTE_STOP_CACHE_TTL_MS) {
    return ctbRouteStopMem[key].stops;
  }
  const disk = readCtbRouteStopDiskCache();
  if (disk[key] && disk[key].at && (now - disk[key].at) < CTB_ROUTE_STOP_CACHE_TTL_MS && Array.isArray(disk[key].stops)) {
    ctbRouteStopMem[key] = disk[key];
    return disk[key].stops;
  }
  const url = CTB_ETA_BASE + '/route-stop/' + CTB_CO + '/' + encodeURIComponent(r) + '/' + bound;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('城巴站序 HTTP ' + res.status);
  const json = await res.json();
  const rows = Array.isArray(json && json.data) ? json.data : [];
  const stops = rows.map(function (row) {
    return { seq: Number(row.seq) || 0, stop: String(row.stop || '') };
  }).filter(function (x) { return x.stop; })
    .sort(function (a, b) { return a.seq - b.seq; });
  const entry = { at: now, stops: stops };
  ctbRouteStopMem[key] = entry;
  disk[key] = entry;
  writeCtbRouteStopDiskCache(disk);
  return stops;
}

async function loadCtbRouteList(force) {
  const now = Date.now();
  if (!force && ctbRouteListMem && ctbRouteListMem.length) return ctbRouteListMem;
  if (!force) {
    try {
      const raw = localStorage.getItem(CTB_ROUTE_LIST_CACHE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.at && (now - parsed.at) < CTB_ROUTE_LIST_CACHE_TTL_MS && Array.isArray(parsed.data) && parsed.data.length) {
          ctbRouteListMem = parsed.data;
          return ctbRouteListMem;
        }
      }
    } catch (e) { /* ignore */ }
  }
  const res = await fetch(CTB_ETA_BASE + '/route/' + CTB_CO, { cache: force ? 'no-store' : 'default' });
  if (!res.ok) throw new Error('城巴路線清單 HTTP ' + res.status);
  const json = await res.json();
  const rows = Array.isArray(json && json.data) ? json.data : [];
  const compact = rows.map(function (r) {
    return {
      route: String(r.route || ''),
      orig_tc: String(r.orig_tc || ''),
      dest_tc: String(r.dest_tc || '')
    };
  }).filter(function (r) { return r.route; });
  ctbRouteListMem = compact;
  try {
    localStorage.setItem(CTB_ROUTE_LIST_CACHE_KEY, JSON.stringify({ at: now, data: compact }));
  } catch (e) { /* quota */ }
  return compact;
}

async function lookupCtbRouteVariants(route) {
  const r = String(route || '').trim().toUpperCase();
  if (!r) return [];
  let matched = null;
  try {
    const list = await loadCtbRouteList(false);
    matched = list.find(function (x) { return String(x.route).toUpperCase() === r; }) || null;
  } catch (e) {
    matched = null;
  }
  if (!matched) {
    try {
      const url = CTB_ETA_BASE + '/route/' + CTB_CO + '/' + encodeURIComponent(r);
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) {
        const json = await res.json();
        const d = json && json.data;
        if (d && d.route) {
          matched = {
            route: String(d.route || r),
            orig_tc: String(d.orig_tc || ''),
            dest_tc: String(d.dest_tc || '')
          };
        }
      }
    } catch (e2) { /* miss */ }
  }
  if (!matched) return [];
  // Verify each direction has stops; Citybus: O→dest, I→orig
  const out = [];
  const dirs = [
    { bound: 'O', dest_tc: matched.dest_tc, orig_tc: matched.orig_tc },
    { bound: 'I', dest_tc: matched.orig_tc, orig_tc: matched.dest_tc }
  ];
  for (let i = 0; i < dirs.length; i++) {
    const d = dirs[i];
    try {
      const stops = await fetchCtbRouteStops(r, d.bound);
      if (!stops.length) continue;
      out.push({
        route: r,
        bound: d.bound,
        service_type: '1',
        orig_tc: d.orig_tc || '',
        dest_tc: d.dest_tc || '',
        operator: 'CTB'
      });
    } catch (e) { /* skip empty dir */ }
  }
  return out;
}

async function lookupRouteVariants(route, pref) {
  const r = String(route || '').trim().toUpperCase();
  const p = String(pref || 'auto').toUpperCase();
  async function asKmb() {
    const rows = await lookupKmbRouteVariants(r);
    return (rows || []).map(function (v) {
      return Object.assign({}, v, { operator: 'KMB' });
    });
  }
  async function asCtb() {
    return await lookupCtbRouteVariants(r);
  }
  if (p === 'CTB') return asCtb();
  if (p === 'KMB') return asKmb();
  // auto: KMB first, then Citybus
  try {
    const kmb = await asKmb();
    if (kmb.length) return kmb;
  } catch (e) { /* fall through */ }
  return asCtb();
}

function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = function (d) { return d * Math.PI / 180; };
  const p1 = toRad(lat1);
  const p2 = toRad(lat2);
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(p1) * Math.cos(p2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function formatBusDistance(meters) {
  if (meters == null || !Number.isFinite(meters)) return '';
  if (meters < 1000) return '約 ' + Math.round(meters) + ' 米';
  return '約 ' + (meters / 1000).toFixed(1) + ' 公里';
}

function parseStopNameTc(nameTc) {
  const raw = String(nameTc || '').trim();
  const m = raw.match(/^(.*?)\s*\(([A-Za-z]{1,4}\d{1,4}[A-Za-z]?)\)\s*$/);
  if (m) {
    return { name: m[1].trim(), code: m[2].toUpperCase() };
  }
  return { name: raw, code: '' };
}

function apiDirToBoundPath(apiDir) {
  const d = String(apiDir || '').toUpperCase();
  if (d === 'I') return 'inbound';
  return 'outbound';
}

function updateBusLocationNote(extra) {
  const note = document.getElementById('busNote');
  if (!note) return;
  let loc = '定位中…';
  if (busGeo) {
    if (busGeo.source === 'gps') {
      const acc = (busGeo.accuracy != null && Number.isFinite(busGeo.accuracy))
        ? '（約 ' + Math.round(busGeo.accuracy) + ' 米精確）'
        : '';
      loc = '使用定位' + acc;
    } else {
      loc = '使用天水圍後備座標';
    }
  }
  const base = loc + '找各線最近站；約每 60 秒更新到站。夜間無班次屬正常。';
  note.textContent = extra ? (extra + ' · ' + base) : base;
}

async function loadKmbStopsCache(force) {
  if (!force && kmbStopsById) return kmbStopsById;
  const now = Date.now();
  if (!force) {
    try {
      const raw = localStorage.getItem(KMB_STOP_CACHE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.at && (now - parsed.at) < KMB_STOP_CACHE_TTL_MS && Array.isArray(parsed.data)) {
          const map = {};
          parsed.data.forEach(function (s) {
            if (s && s.id) map[s.id] = s;
          });
          if (Object.keys(map).length > 100) {
            kmbStopsById = map;
            return kmbStopsById;
          }
        }
      }
    } catch (e) { /* ignore corrupt cache */ }
  }
  const res = await fetch(KMB_ETA_BASE + '/stop', { cache: force ? 'no-store' : 'default' });
  if (!res.ok) throw new Error('站點清單 HTTP ' + res.status);
  const json = await res.json();
  const rows = Array.isArray(json && json.data) ? json.data : [];
  const compact = [];
  const map = {};
  rows.forEach(function (s) {
    if (!s || !s.stop) return;
    const lat = parseFloat(s.lat);
    const lng = parseFloat(s.long);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    const entry = { id: String(s.stop), n: String(s.name_tc || s.name_en || ''), lat: lat, lng: lng };
    compact.push(entry);
    map[entry.id] = entry;
  });
  kmbStopsById = map;
  try {
    localStorage.setItem(KMB_STOP_CACHE_KEY, JSON.stringify({ at: now, data: compact }));
  } catch (e) {
    // Quota or private mode — keep in-memory only
  }
  return kmbStopsById;
}

async function fetchRouteStops(route, apiDir, serviceType) {
  const r = String(route || '').trim().toUpperCase();
  const bound = apiDirToBoundPath(apiDir);
  const st = String(serviceType || '1');
  const key = r + '|' + bound + '|' + st;
  const now = Date.now();
  if (kmbRouteStopMem[key] && (now - kmbRouteStopMem[key].at) < KMB_ROUTE_STOP_CACHE_TTL_MS) {
    return kmbRouteStopMem[key].stops;
  }
  const disk = readRouteStopDiskCache();
  if (disk[key] && disk[key].at && (now - disk[key].at) < KMB_ROUTE_STOP_CACHE_TTL_MS && Array.isArray(disk[key].stops)) {
    kmbRouteStopMem[key] = disk[key];
    return disk[key].stops;
  }
  const url = KMB_ETA_BASE + '/route-stop/' + encodeURIComponent(r) + '/' + bound + '/' + encodeURIComponent(st);
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('路線站序 HTTP ' + res.status);
  const json = await res.json();
  const rows = Array.isArray(json && json.data) ? json.data : [];
  const stops = rows.map(function (row) {
    return { seq: Number(row.seq) || 0, stop: String(row.stop || '') };
  }).filter(function (x) { return x.stop; })
    .sort(function (a, b) { return a.seq - b.seq; });
  const entry = { at: now, stops: stops };
  kmbRouteStopMem[key] = entry;
  disk[key] = entry;
  writeRouteStopDiskCache(disk);

async function fetchRouteStopsWithProbe(route, apiDir, preferredServiceType) {
  const prefer = Number(preferredServiceType);
  const tryOrder = [];
  if (Number.isFinite(prefer) && prefer >= 1) tryOrder.push(prefer);
  [1, 2, 3].forEach(function (st) {
    if (tryOrder.indexOf(st) === -1) tryOrder.push(st);
  });
  let lastStops = [];
  for (let i = 0; i < tryOrder.length; i++) {
    const st = tryOrder[i];
    try {
      const stops = await fetchRouteStops(route, apiDir, st);
      lastStops = stops || [];
      if (lastStops.length) return { serviceType: st, stops: lastStops };
    } catch (e) { /* try next */ }
  }
  return { serviceType: tryOrder[0] || 1, stops: lastStops };
}

function requestBrowserGeo() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }
    let settled = false;
    const timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      resolve(null);
    }, BUS_GEO_TIMEOUT_MS);
    try {
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          const lat = pos && pos.coords && pos.coords.latitude;
          const lng = pos && pos.coords && pos.coords.longitude;
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            resolve(null);
            return;
          }
          resolve({
            lat: lat,
            lng: lng,
            source: 'gps',
            accuracy: (pos.coords && Number.isFinite(pos.coords.accuracy)) ? pos.coords.accuracy : null,
            at: Date.now()
          });
        },
        function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(null);
        },
        { enableHighAccuracy: true, timeout: BUS_GEO_TIMEOUT_MS, maximumAge: 60000 }
      );
    } catch (e) {
      if (!settled) {
        settled = true;
        clearTimeout(timer);
        resolve(null);
      }
    }
  });
}

async function ensureBusGeo(force) {
  if (!force && busGeo && busGeo.lat != null) return busGeo;
  updateBusLocationNote('正在取得定位');
  const gps = await requestBrowserGeo();
  if (gps) {
    busGeo = gps;
  } else {
    busGeo = {
      lat: TSW_FALLBACK.lat,
      lng: TSW_FALLBACK.lng,
      source: 'fallback',
      accuracy: null,
      at: Date.now()
    };
  }
  updateBusLocationNote();
  return busGeo;
}

function pickNearestRouteStop(routeStops, geo, stopsMap) {
  let best = null;
  (routeStops || []).forEach(function (rs) {
    const info = stopsMap[rs.stop];
    if (!info) return;
    const d = haversineMeters(geo.lat, geo.lng, info.lat, info.lng);
    if (!best || d < best.distM) {
      best = { stopId: rs.stop, seq: rs.seq, distM: d, info: info };
    }
  });
  return best;
}

async function resolveNearbyStopsForBuses(opts) {
  const forceGeo = !!(opts && opts.forceGeo);
  const forceStops = !!(opts && opts.forceStops);
  if (busNearbyInFlight && !forceGeo && !forceStops) {
    try { await busNearbyInFlight; } catch (e) {}
    return;
  }
  const run = (async function () {
    updateBusLocationNote('載入站點資料');
    await ensureBusGeo(forceGeo);
    const buses = Array.isArray(state.busStops) ? state.busStops : [];
    const needKmb = buses.some(function (x) { return resolveBusOperator(x) !== 'CTB'; });
    const needCtb = buses.some(function (x) { return resolveBusOperator(x) === 'CTB'; });
    let kmbStopsMap = null;
    if (needKmb) {
      try {
        kmbStopsMap = await loadKmbStopsCache(forceStops);
      } catch (err) {
        if (!needCtb) {
          updateBusLocationNote('站點清單載入失敗');
          throw err;
        }
        updateBusLocationNote('九巴站點清單載入失敗，城巴仍繼續');
      }
    }
    let resolved = 0;
    for (let i = 0; i < buses.length; i++) {
      const b = normalizeBusEntry(buses[i]);
      const route = String(b.route || '').trim();
      const apiDir = resolveBusApiDir(b);
      const op = resolveBusOperator(b);
      if (!route || !apiDir) {
        buses[i] = b;
        continue;
      }
      try {
        if (op === 'CTB') {
          const stops = await fetchCtbRouteStops(route, apiDir);
          await ensureCtbStopsMap(stops.map(function (s) { return s.stop; }));
          const nearest = pickNearestRouteStop(stops, busGeo, ctbStopsById);
          if (nearest && nearest.info) {
            b.stopName = nearest.info.n || b.stopName || '';
            b.ctbStopId = nearest.stopId;
            b.stopId = nearest.stopId;
            b.kmbStopId = '';
            b.nearbyDistM = Math.round(nearest.distM);
            b.nearbySeq = nearest.seq;
            b.operator = 'CTB';
            resolved += 1;
          }
        } else if (kmbStopsMap) {
          const probed = await fetchRouteStopsWithProbe(route, apiDir, b.serviceType);
          const nearest = pickNearestRouteStop(probed.stops, busGeo, kmbStopsMap);
          if (nearest && nearest.info) {
            const parsed = parseStopNameTc(nearest.info.n);
            b.stopName = parsed.name || nearest.info.n;
            b.stopId = parsed.code || b.stopId || '';
            b.kmbStopId = nearest.stopId;
            b.nearbyDistM = Math.round(nearest.distM);
            b.nearbySeq = nearest.seq;
            b.serviceType = probed.serviceType;
            b.operator = 'KMB';
            resolved += 1;
          }
        }
      } catch (e) {
        // keep previous stop for this card
      }
      buses[i] = b;
    }
    state.busStops = buses;
    saveState();
    updateBusLocationNote(resolved ? ('已更新 ' + resolved + ' 個最近站') : null);
  })();
  busNearbyInFlight = run;
  try {
    await run;
  } finally {
    if (busNearbyInFlight === run) busNearbyInFlight = null;
  }
}

async function refreshAllBusEtas(opts) {
  const force = !!(opts && opts.force);
  const buses = Array.isArray(state.busStops) ? state.busStops : [];
  /** @type {{key:string, op:string, stopId:string, route:string}[]} */
  const jobs = [];
  const seen = {};
  buses.forEach(function (b) {
    const key = busEtaCacheKey(b);
    if (!key || seen[key]) return;
    seen[key] = true;
    jobs.push({
      key: key,
      op: resolveBusOperator(b),
      stopId: resolveStopApiId(b),
      route: String(b.route || '').trim().toUpperCase()
    });
  });

  // Show loading on cards that need a fetch
  buses.forEach(function (b) {
    const card = document.querySelector('.bus-card[data-id="' + String(b.id).replace(/"/g, '') + '"]');
    const etaEl = card && card.querySelector('.bus-eta');
    const key = busEtaCacheKey(b);
    if (!etaEl) return;
    if (!key) {
      setBusEtaEl(etaEl, b, { rows: [], error: 'missing' });
      return;
    }
    if (force || !busEtaByStop[key]) {
      setBusEtaEl(etaEl, b, null);
    } else {
      setBusEtaEl(etaEl, b, busEtaByStop[key]);
    }
  });

  if (!jobs.length) return;

  if (busEtaInFlight && !force) {
    try { await busEtaInFlight; } catch (e) {}
    return;
  }

  const run = (async function () {
    await Promise.all(jobs.map(async function (job) {
      try {
        let rows = [];
        if (job.op === 'CTB') {
          rows = await fetchCtbStopRouteEta(job.stopId, job.route);
        } else {
          rows = await fetchKmbStopEta(job.stopId);
        }
        busEtaByStop[job.key] = { rows: rows, at: Date.now() };
      } catch (err) {
        busEtaByStop[job.key] = { rows: [], error: String(err && err.message || err), at: Date.now() };
      }
    }));
    buses.forEach(function (b) {
      const card = document.querySelector('.bus-card[data-id="' + String(b.id).replace(/"/g, '') + '"]');
      const etaEl = card && card.querySelector('.bus-eta');
      const key = busEtaCacheKey(b);
      if (!etaEl || !key) return;
      setBusEtaEl(etaEl, b, busEtaByStop[key]);
    });
    const note = document.getElementById('busNote');
    if (note) {
      const anyErr = jobs.some(function (j) { return busEtaByStop[j.key] && busEtaByStop[j.key].error; });
      const anyOk = jobs.some(function (j) { return busEtaByStop[j.key] && !busEtaByStop[j.key].error; });
      let locBit = '';
      if (busGeo) {
        locBit = busGeo.source === 'gps' ? '使用定位' : '使用天水圍後備';
      }
      if (anyOk && !anyErr) {
        updateBusLocationNote(locBit || null);
      } else if (anyOk && anyErr) {
        note.textContent = (locBit ? locBit + '。' : '') + '部分車站到站時間未能更新，其餘已顯示。可再按「更新到站」重試。';
      } else if (anyErr) {
        note.textContent = '暫時無法連接到站 API（九巴／城巴），請稍後再試「更新到站」。';
      }
    }
  })();

  busEtaInFlight = run;
  try {
    await run;
  } finally {
    if (busEtaInFlight === run) busEtaInFlight = null;
  }
}

function stopBusEtaAutoRefresh() {
  if (busEtaTimer) {
    clearInterval(busEtaTimer);
    busEtaTimer = null;
  }
}

async function startBusNearbyAndEta(immediate) {
  stopBusEtaAutoRefresh();
  if (immediate) {
    try {
      await resolveNearbyStopsForBuses({ forceGeo: !busGeo });
      renderBus();
    } catch (e) {
      updateBusLocationNote('最近站更新失敗，仍顯示已儲存站點');
      renderBus();
    }
    await refreshAllBusEtas({ force: true });
  }
  stopBusEtaAutoRefresh();
  busEtaTimer = setInterval(function () {
    if (state.busExpanded) refreshAllBusEtas({ force: true });
  }, 60000);
}

function startBusEtaAutoRefresh(immediate) {
  // Back-compat wrapper
  startBusNearbyAndEta(immediate);

function busCardMetaLine(b) {
  const bits = [];
  if (b.nearbyDistM != null && Number.isFinite(b.nearbyDistM)) {
    bits.push(formatBusDistance(b.nearbyDistM));
  }
  if (busGeo && busGeo.source === 'gps') bits.push('定位最近站');
  else if (busGeo && busGeo.source === 'fallback') bits.push('天水圍後備最近站');
  return bits.join(' · ');
}

const KMB_ROUTE_LIST_CACHE_KEY = 'kmb-route-list-cache-v1';
const KMB_ROUTE_LIST_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
/** @type {any[]|null} */
let kmbRouteListMem = null;

async function loadKmbRouteList(force) {
  const now = Date.now();
  if (!force && kmbRouteListMem && kmbRouteListMem.length) return kmbRouteListMem;
  if (!force) {
    try {
      const raw = localStorage.getItem(KMB_ROUTE_LIST_CACHE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.at && (now - parsed.at) < KMB_ROUTE_LIST_CACHE_TTL_MS && Array.isArray(parsed.data) && parsed.data.length) {
          kmbRouteListMem = parsed.data;
          return kmbRouteListMem;
        }
      }
    } catch (e) { /* ignore */ }
  }
  const res = await fetch(KMB_ETA_BASE + '/route/', { cache: force ? 'no-store' : 'default' });
  if (!res.ok) throw new Error('路線清單 HTTP ' + res.status);
  const json = await res.json();
  const rows = Array.isArray(json && json.data) ? json.data : [];
  const compact = rows.map(function (r) {
    return {
      route: String(r.route || ''),
      bound: String(r.bound || '').toUpperCase(),
      service_type: String(r.service_type || '1'),
      orig_tc: String(r.orig_tc || ''),
      dest_tc: String(r.dest_tc || '')
    };
  }).filter(function (r) { return r.route && (r.bound === 'O' || r.bound === 'I'); });
  kmbRouteListMem = compact;
  try {
    localStorage.setItem(KMB_ROUTE_LIST_CACHE_KEY, JSON.stringify({ at: now, data: compact }));
  } catch (e) { /* quota */ }
  return compact;
}

async function lookupKmbRouteVariants(route) {
  const r = String(route || '').trim().toUpperCase();
  if (!r) return [];
  const list = await loadKmbRouteList(false);
  const matched = list.filter(function (x) { return String(x.route).toUpperCase() === r; });
  if (matched.length) return matched;
  // Fallback: probe outbound/inbound service 1–2 when list miss (rare)
  const out = [];
  const bounds = ['outbound', 'inbound'];
  for (let bi = 0; bi < bounds.length; bi++) {
    for (let st = 1; st <= 2; st++) {
      try {
        const url = KMB_ETA_BASE + '/route/' + encodeURIComponent(r) + '/' + bounds[bi] + '/' + st;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) continue;
        const json = await res.json();
        const d = json && json.data;
        if (!d || !d.route) continue;
        out.push({
          route: String(d.route || r),
          bound: String(d.bound || (bounds[bi] === 'inbound' ? 'I' : 'O')).toUpperCase(),
          service_type: String(d.service_type || st),
          orig_tc: String(d.orig_tc || ''),
          dest_tc: String(d.dest_tc || '')
        });
      } catch (e) { /* skip */ }
    }
  }
  return out;
}

function destKeywordsFromDest(destTc) {
  const d = String(destTc || '').trim();
  if (!d) return [];
  const keys = [d];
  const short = d.replace(/[()（）\s].*$/, '').trim();
  if (short && short !== d && short.length >= 2) keys.push(short);
  return keys;
}

function reorderBuses(fromId, toId) {
  if (!Array.isArray(state.busStops)) return;
  const fromIdx = state.busStops.findIndex(function (s) { return s.id === fromId; });
  const toIdx = state.busStops.findIndex(function (s) { return s.id === toId; });
  if (fromIdx < 0 || toIdx < 0) return;
  const item = state.busStops.splice(fromIdx, 1)[0];
  state.busStops.splice(toIdx, 0, item);
  saveState();
  renderBus();
  updateBlockSummaries();
}

function deleteBusRoute(busId) {
  const b = (state.busStops || []).find(function (x) { return x.id === busId; });
  if (!b) return;
  const label = (b.route || '') + (b.direction ? ' ' + b.direction : '');
  if (!confirm('確定刪除此路線？\n' + (label || busId))) return;
  state.busStops = (state.busStops || []).filter(function (x) { return x.id !== busId; });
  saveState();
  renderBus();
  updateBlockSummaries();
  if (state.busExpanded) refreshAllBusEtas({ force: true });
}

function bindBusDnD(card, list) {
  const id = card.getAttribute('data-id');
  card.setAttribute('draggable', 'true');

  card.addEventListener('dragstart', function (e) {
    if (e.target.closest('.bus-del')) {
      e.preventDefault();
      return;
    }
    busDragId = id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (_) {}
  });
  card.addEventListener('dragend', function () {
    card.classList.remove('dragging');
    list.querySelectorAll('.drag-over').forEach(function (x) { x.classList.remove('drag-over'); });
    busDragId = null;
  });
  card.addEventListener('dragover', function (e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', function () { card.classList.remove('drag-over'); });
  card.addEventListener('drop', function (e) {
    e.preventDefault();
    card.classList.remove('drag-over');
    const from = busDragId || e.dataTransfer.getData('text/plain');
    const to = id;
    if (from && to && from !== to) reorderBuses(from, to);
  });

  let startX, startY;
  card.addEventListener('touchstart', function (e) {
    if (e.target.closest('.bus-del')) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    longPressTimer = setTimeout(function () {
      busDragId = id;
      card.classList.add('dragging');
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) {}
    }, 420);
  }, { passive: true });
  card.addEventListener('touchmove', function (e) {
    const t = e.touches[0];
    if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
      if (!busDragId) clearTimeout(longPressTimer);
    }
    if (busDragId) {
      e.preventDefault();
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('.bus-card');
      list.querySelectorAll('.drag-over').forEach(function (x) { x.classList.remove('drag-over'); });
      if (target && target.getAttribute('data-id') !== busDragId) target.classList.add('drag-over');
    }
  }, { passive: false });
  card.addEventListener('touchend', function (e) {
    clearTimeout(longPressTimer);
    if (busDragId) {
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('.bus-card');
      const to = target && target.getAttribute('data-id');
      if (to && to !== busDragId) reorderBuses(busDragId, to);
      list.querySelectorAll('.bus-card').forEach(function (x) { x.classList.remove('dragging', 'drag-over'); });
      busDragId = null;
      e.preventDefault();
    }
  });
  card.addEventListener('touchcancel', function () {
    clearTimeout(longPressTimer);
    card.classList.remove('dragging');
    busDragId = null;
  });
}

function openBusAddModal() {
  openModal(
    '<h3>新增巴士路線</h3>' +
    '<form class="form-stack" id="busAddForm">' +
      '<div><label class="field-label">路線號碼</label>' +
        '<input type="text" name="route" required maxlength="10" placeholder="例如 E21D / 69M" autocomplete="off" style="text-transform:uppercase" /></div>' +
      '<div><label class="field-label">營辦商</label>' +
        '<select name="operatorPref" id="busOperatorPref">' +
          '<option value="auto" selected>自動（先九巴再城巴）</option>' +
          '<option value="KMB">九巴／龍運</option>' +
          '<option value="CTB">城巴</option>' +
        '</select></div>' +
      '<div class="modal-actions" style="justify-content:flex-start;margin-top:0">' +
        '<button type="button" class="btn btn-ghost btn-sm" id="busLookupBtn">查詢路線</button>' +
      '</div>' +
      '<p class="bus-add-status" id="busAddStatus"></p>' +
      '<div><label class="field-label">方向／目的地</label>' +
        '<select name="variant" id="busVariantSelect" required disabled>' +
          '<option value="">請先查詢路線</option>' +
        '</select></div>' +
      '<div id="busServiceTypeField"><label class="field-label">服務類型 service_type（九巴可選，預設 1）</label>' +
        '<input type="number" name="serviceType" id="busServiceType" min="1" max="99" step="1" value="1" /></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" id="busAddCancel">取消</button>' +
        '<button type="submit" class="btn btn-primary" id="busAddSubmit" disabled>新增</button>' +
      '</div>' +
    '</form>'
  );

  const form = document.getElementById('busAddForm');
  const statusEl = document.getElementById('busAddStatus');
  const select = document.getElementById('busVariantSelect');
  const stInput = document.getElementById('busServiceType');
  const stField = document.getElementById('busServiceTypeField');
  const submitBtn = document.getElementById('busAddSubmit');
  const lookupBtn = document.getElementById('busLookupBtn');
  const opPref = document.getElementById('busOperatorPref');
  const routeInput = form.querySelector('[name="route"]');
  /** @type {any[]} */
  let variants = [];

  function setStatus(msg, cls) {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.className = 'bus-add-status' + (cls ? ' ' + cls : '');
  }

  function syncServiceTypeVisibility() {
    const allCtb = variants.length > 0 && variants.every(function (v) {
      return String(v.operator || '').toUpperCase() === 'CTB';
    });
    if (stField) {
      if (allCtb) stField.classList.add('is-hidden');
      else stField.classList.remove('is-hidden');
    }
  }

  function fillVariants(rows) {
    variants = rows || [];
    select.innerHTML = '';
    if (!variants.length) {
      select.innerHTML = '<option value="">找不到此路線</option>';
      select.disabled = true;
      submitBtn.disabled = true;
      syncServiceTypeVisibility();
      return;
    }
    variants.forEach(function (v, i) {
      const bound = String(v.bound || '').toUpperCase();
      const boundLabel = bound === 'I' ? '回程 I' : '去程 O';
      const dest = v.dest_tc || '—';
      const st = v.service_type || '1';
      const op = String(v.operator || 'KMB').toUpperCase() === 'CTB' ? '城巴' : '九巴';
      const opt = document.createElement('option');
      opt.value = String(i);
      if (String(v.operator || '').toUpperCase() === 'CTB') {
        opt.textContent = '往' + dest + '（' + op + ' · ' + boundLabel + '）';
      } else {
        opt.textContent = '往' + dest + '（' + op + ' · ' + boundLabel + ' · 服務 ' + st + '）';
      }
      select.appendChild(opt);
    });
    select.disabled = false;
    submitBtn.disabled = false;
    select.selectedIndex = 0;
    stInput.value = String(variants[0].service_type || '1');
    syncServiceTypeVisibility();
  }

  select.addEventListener('change', function () {
    const v = variants[Number(select.value)];
    if (v) stInput.value = String(v.service_type || '1');
    syncServiceTypeVisibility();
  });

  async function doLookup() {
    const route = String(routeInput.value || '').trim().toUpperCase();
    routeInput.value = route;
    if (!route) {
      setStatus('請輸入路線號碼', 'is-error');
      return;
    }
    lookupBtn.disabled = true;
    setStatus('查詢中…');
    try {
      const pref = (opPref && opPref.value) || 'auto';
      const rows = await lookupRouteVariants(route, pref);
      if (!rows.length) {
        fillVariants([]);
        setStatus('找不到「' + route + '」——請確認是九巴／龍運／城巴路線', 'is-error');
        return;
      }
      fillVariants(rows);
      const opHint = String(rows[0].operator || '').toUpperCase() === 'CTB' ? '城巴' : '九巴／龍運';
      setStatus('找到 ' + rows.length + ' 個方向（' + opHint + '）', 'is-ok');
    } catch (err) {
      fillVariants([]);
      setStatus('查詢失敗，請稍後再試', 'is-error');
    } finally {
      lookupBtn.disabled = false;
    }
  }

  document.getElementById('busAddCancel').onclick = closeModal;
  lookupBtn.onclick = function () { doLookup(); };
  routeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doLookup();
    }
  });

  form.onsubmit = async function (e) {
    e.preventDefault();
    const route = String(routeInput.value || '').trim().toUpperCase();
    if (!route) {
      setStatus('請輸入路線號碼', 'is-error');
      return;
    }
    if (!variants.length) {
      setStatus('請先查詢並選擇方向', 'is-error');
      await doLookup();
      return;
    }
    const v = variants[Number(select.value)];
    if (!v) {
      setStatus('請選擇方向', 'is-error');
      return;
    }
    const operator = String(v.operator || 'KMB').toUpperCase() === 'CTB' ? 'CTB' : 'KMB';
    const apiDir = String(v.bound || '').toUpperCase() === 'I' ? 'I' : 'O';
    let serviceType = Number(stInput.value);
    if (!Number.isFinite(serviceType) || serviceType < 1) serviceType = Number(v.service_type) || 1;
    if (operator === 'CTB') serviceType = 1;
    const destTc = String(v.dest_tc || '').trim();
    const direction = destTc ? ('往' + destTc) : (apiDir === 'I' ? '回程（Inbound）' : '去程（Outbound）');
    const entry = normalizeBusEntry({
      id: uid('bus'),
      route: route,
      operator: operator,
      direction: direction,
      apiDir: apiDir,
      serviceType: serviceType,
      destKeywords: destKeywordsFromDest(destTc),
      stopName: '',
      stopId: '',
      kmbStopId: '',
      ctbStopId: ''
    });
    if (!Array.isArray(state.busStops)) state.busStops = cloneSeedBus();
    // Avoid exact duplicate operator+route+dir+service
    const dup = state.busStops.some(function (b) {
      return resolveBusOperator(b) === operator &&
        String(b.route || '').toUpperCase() === route &&
        resolveBusApiDir(b) === apiDir &&
        String(b.serviceType || 1) === String(serviceType);
    });
    if (dup && !confirm('已有相同營辦商／路線／方向，仍要再加一張卡？')) return;

    submitBtn.disabled = true;
    setStatus('新增中，正在找最近站…');
    state.busStops.push(entry);
    saveState();
    closeModal();
    renderBus();
    updateBlockSummaries();
    try {
      if (!state.busExpanded) {
        state.busExpanded = true;
        applyExpandableSection('bus', true);
        saveState();
      }
      await resolveNearbyStopsForBuses({ forceGeo: !busGeo });
      renderBus();
      await refreshAllBusEtas({ force: true });
      startBusNearbyAndEta(false);
    } catch (err) {
      updateBusLocationNote('已新增路線，最近站稍後再試');
      renderBus();
    }
  };
}


function busCardDirectionClass(b) {

          '<div class="bus-eta' + (eta.cls ? ' ' + eta.cls : '') + '">' + eta.html + '</div>' +

  list.querySelectorAll('.bus-card').forEach(function (card) {

    };

      open();
    });

        e.preventDefault();
        open();
      }
    });
    const delBtn = card.querySelector('[data-bus-del]');

      delBtn.addEventListener('click', function (e) {

      });

  });

  bindBusEtaControls();
}

async function fetchKmbRouteEta(route, serviceType) {
  const r = String(route || '').trim().toUpperCase();
  const st = String(serviceType || '1');
  const url = KMB_ETA_BASE + '/route-eta/' + encodeURIComponent(r) + '/' + encodeURIComponent(st);
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  return Array.isArray(json && json.data) ? json.data : [];
}

function groupRouteEtaByDirSeq(rows) {
  /** @type {Record<string, any[]>} */
  const map = {};
  (rows || []).forEach(function (row) {
    if (!row || row.eta == null || String(row.eta).trim() === '') return;
    const dir = String(row.dir || '').toUpperCase();
    const seq = Number(row.seq) || 0;
    const key = dir + '|' + seq;
    if (!map[key]) map[key] = [];
    map[key].push(row);
  });
  Object.keys(map).forEach(function (k) {
    map[k].sort(function (a, b) {
      const ta = new Date(a.eta).getTime();
      const tb = new Date(b.eta).getTime();
      if (ta !== tb) return ta - tb;
      return (Number(a.eta_seq) || 99) - (Number(b.eta_seq) || 99);
    });
  });
  return map;
}

function directionLabelForApiDir(bus, apiDir) {
  const d = String(apiDir || '').toUpperCase();
  if (d && resolveBusApiDir(bus) === d && bus.direction) return bus.direction;
  // Soft labels from dest keywords / common patterns
  if (d === 'O') {
    if (String(bus.route).toUpperCase() === 'E36A') return '往東涌(逸東)';
    if (String(bus.route).toUpperCase() === 'E37') return '往機場(地面運輸中心)';
    if (String(bus.route).toUpperCase() === '69X') return '往高鐵(西九龍站)';
    if (String(bus.route).toUpperCase() === '265B') return '往旺角(柏景灣)';
    if (bus.destOutbound) return '往' + bus.destOutbound;
    return '去程（Outbound）';
  }
  if (d === 'I') {
    if (String(bus.route).toUpperCase() === 'E36A') return '往元朗(德業街)';
    if (bus.destInbound) return '往' + bus.destInbound;
    return '回程（Inbound）';
  }
  return '路線';
}

function renderRouteStopRowsHtml(stops, etaMap, apiDir, nearbyKmbId, stopsMap) {
  if (!stops || !stops.length) {
    return '<div class="bus-route-empty">此方向暫時沒有站序資料</div>';
  }
  return stops.map(function (rs) {
    const info = stopsMap && stopsMap[rs.stop];
    const parsed = parseStopNameTc(info ? info.n : '');
    const name = parsed.name || (info ? info.n : rs.stop);
    const isNear = nearbyKmbId && rs.stop === nearbyKmbId;
    const etaRows = etaMap[String(apiDir).toUpperCase() + '|' + rs.seq] || [];
    const labels = etaRows.slice(0, 2).map(function (r) { return formatEtaMinutes(r.eta); }).filter(Boolean);
    const rmk = etaRows.map(function (r) { return String(r.rmk_tc || '').trim(); }).find(Boolean);
    let etaHtml = labels.length ? escapeHtml(labels.join(' · ')) : '—';
    if (rmk && labels.length) {
      etaHtml += '<span class="rmk">' + escapeHtml(rmk) + '</span>';
    }
    return (
      '<div class="bus-route-stop' + (isNear ? ' is-nearby' : '') + '"' + (isNear ? ' id="busNearStopRow"' : '') + '>' +
        '<div class="seq">' + escapeHtml(String(rs.seq || '')) + '</div>' +
        '<div class="name">' + escapeHtml(name || '—') +
          (isNear ? '<span class="near-tag">最近</span>' : '') +
        '</div>' +
        '<div class="eta-col">' + etaHtml + '</div>' +
      '</div>'
    );
  }).join('');
}

async function openBusRouteSheet(busId) {
  const bus = (state.busStops || []).map(normalizeBusEntry).find(function (b) { return b.id === busId; });
  if (!bus) return;
  const route = String(bus.route || '').trim().toUpperCase();
  const watchedDir = resolveBusApiDir(bus);
  const operator = resolveBusOperator(bus);
  const opLabel = operator === 'CTB' ? '城巴' : '九巴';
  openModal(
    '<h3>' + escapeHtml(route || '巴士') + ' 沿線 <span class="bus-op-badge ' + (operator === 'CTB' ? 'is-ctb' : 'is-kmb') + '">' + opLabel + '</span></h3>' +
    '<p class="bus-route-hint bus-route-loading" id="busRouteHint">載入沿線站點與到站時間…</p>' +
    '<div id="busRouteBody"><div class="bus-route-loading">請稍候</div></div>' +
    '<div class="modal-actions">' +
      '<button type="button" class="btn btn-ghost" id="busRouteClose">關閉</button>' +
    '</div>'
  );
  const closeBtn = document.getElementById('busRouteClose');
  if (closeBtn) closeBtn.onclick = closeModal;

  try {
    const dirs = watchedDir === 'I' ? ['I', 'O'] : ['O', 'I'];
    const dirData = {};
    let stopsMap = {};
    let etaRows = [];
    let nearbyId = '';

    if (operator === 'CTB') {
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        try {
          const stops = await fetchCtbRouteStops(route, d);
          dirData[d] = { serviceType: 1, stops: stops || [] };
        } catch (e) {
          dirData[d] = { serviceType: 1, stops: [] };
        }
      }
      const allStopIds = [];
      dirs.forEach(function (d) {
        ((dirData[d] && dirData[d].stops) || []).forEach(function (rs) {
          if (rs.stop) allStopIds.push(rs.stop);
        });
      });
      await ensureCtbStopsMap(allStopIds);
      stopsMap = ctbStopsById;
      nearbyId = resolveCtbStopId(bus);
      // Citybus has no route-eta bulk API — fetch per-stop ETA (concurrency limited)
      const uniqueStops = [];
      const seenStop = {};
      allStopIds.forEach(function (id) {
        if (!id || seenStop[id]) return;
        seenStop[id] = true;
        uniqueStops.push(id);
      });
      const hintEl = document.getElementById('busRouteHint');
      if (hintEl) {
        hintEl.className = 'bus-route-hint bus-route-loading';
        hintEl.textContent = '載入城巴各站到站（約 ' + uniqueStops.length + ' 站）…';
      }
      const batches = await mapPool(uniqueStops, 6, async function (sid) {
        try {
          return await fetchCtbStopRouteEta(sid, route);
        } catch (e) {
          return [];
        }
      });
      etaRows = [];
      (batches || []).forEach(function (rows) {
        (rows || []).forEach(function (row) { etaRows.push(row); });
      });
    } else {
      stopsMap = await loadKmbStopsCache(false);
      let serviceType = bus.serviceType || 1;
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        try {
          const probed = await fetchRouteStopsWithProbe(route, d, d === watchedDir ? bus.serviceType : undefined);
          dirData[d] = probed;
          if (d === watchedDir && probed.serviceType) serviceType = probed.serviceType;
        } catch (e) {
          dirData[d] = { serviceType: 1, stops: [] };
        }
      }
      try {
        etaRows = await fetchKmbRouteEta(route, serviceType);
      } catch (e1) {
        if (serviceType !== 1) {
          try { etaRows = await fetchKmbRouteEta(route, 1); } catch (e2) { etaRows = []; }
        }
      }
      nearbyId = resolveKmbStopId(bus);
    }

    const etaMap = groupRouteEtaByDirSeq(etaRows);
    const hint = document.getElementById('busRouteHint');
    if (hint) {
      const destSample = (etaRows.find(function (r) { return r && r.dest_tc; }) || {}).dest_tc;
      hint.className = 'bus-route-hint';
      hint.textContent = (operator === 'CTB' ? '城巴官方到站' : '九巴官方路線到站') +
        ' · 高亮為你附近的站' + (bus.stopName ? '（' + bus.stopName + '）' : '') +
        (destSample ? '' : '');
    }
    const body = document.getElementById('busRouteBody');
    if (!body) return;
    body.innerHTML = dirs.map(function (d) {
      const label = directionLabelForApiDir(bus, d);
      const watched = d === watchedDir;
      const stops = (dirData[d] && dirData[d].stops) || [];
      return (
        '<div class="bus-route-dir' + (watched ? ' is-watched' : '') + '">' + escapeHtml(label) + '</div>' +
        '<div class="bus-route-stops">' +
          renderRouteStopRowsHtml(stops, etaMap, d, watched ? nearbyId : '', stopsMap) +
        '</div>'
      );
    }).join('');
    const nearRow = document.getElementById('busNearStopRow');
    if (nearRow && nearRow.scrollIntoView) {
      setTimeout(function () {
        try { nearRow.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
      }, 80);
    }
  } catch (err) {
    const hint = document.getElementById('busRouteHint');
    if (hint) {
      hint.className = 'bus-route-hint bus-route-error';
      hint.textContent = '無法載入沿線資料，請稍後再試。';
    }
    const body = document.getElementById('busRouteBody');
    if (body) body.innerHTML = '<div class="bus-route-error">載入失敗</div>';
  }
}

function emojiFromWmo(code) {
  if (code == null || code === '') return '⛅';
  return WMO_WEATHER_EMOJI[code] || '⛅';
}

function emojiFromHkoIcon(iconField) {
  let code = null;
  if (Array.isArray(iconField) && iconField.length) code = iconField[0];
  else if (typeof iconField === 'number') code = iconField;
  else if (typeof iconField === 'string' && iconField.trim()) code = parseInt(iconField, 10);
  if (code == null || isNaN(code)) return '⛅';
  return HKO_ICON_EMOJI[code] || '⛅';
}

function hkNowParts() {
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: HK_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false, weekday: 'short'
  });
  const parts = {};
  fmt.formatToParts(new Date()).forEach(function (p) {
    if (p.type !== 'literal') parts[p.type] = p.value;
  });
  const wdMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const wd = wdMap[parts.weekday];
  return {
    y: parseInt(parts.year, 10),
    m: parseInt(parts.month, 10),
    d: parseInt(parts.day, 10),
    hh: parts.hour === '24' ? '00' : parts.hour,
    mm: parts.minute,
    ss: parts.second,
    weekday: typeof wd === 'number' ? wd : 0
  };
}

function formatHkDate(p) {
  return p.y + '年' + p.m + '月' + p.d + '日 (' + WEEKDAYS_HK[p.weekday] + ')';
}

function updateLunarJieqi(p) {
  const lunarEl = document.getElementById('hdrLunar');
  const jieqiEl = document.getElementById('hdrJieqi');
  if (typeof Solar === 'undefined') {
    if (lunarEl) lunarEl.textContent = '—';
    if (jieqiEl) jieqiEl.textContent = '—';
    return;
  }
  try {
    const lunar = Solar.fromYmd(p.y, p.m, p.d).getLunar();
    const monthStr = lunar.getMonthInChinese();
    const dayStr = lunar.getDayInChinese();
    if (lunarEl) lunarEl.textContent = '農曆' + monthStr + '月' + dayStr;

    let jieqiName = '';
    const cur = lunar.getCurrentJieQi && lunar.getCurrentJieQi();
    if (cur && cur.getName) {
      jieqiName = cur.getName();
    } else if (lunar.getJieQi && lunar.getJieQi()) {
      jieqiName = lunar.getJieQi();
    } else if (lunar.getPrevJieQi) {
      const prev = lunar.getPrevJieQi(true);
      if (prev && prev.getName) jieqiName = prev.getName();
    }
    if (jieqiEl) {
      if (jieqiName) {
        jieqiEl.textContent = /節氣$/.test(jieqiName) ? jieqiName : (jieqiName + '節氣');
      } else {
        jieqiEl.textContent = '—';
      }
    }
  } catch (err) {
    if (lunarEl) lunarEl.textContent = '—';
    if (jieqiEl) jieqiEl.textContent = '—';
  }
}

let _lastLunarKey = '';
function tickHeaderClock() {
  const p = hkNowParts();
  const dateEl = document.getElementById('hdrDate');
  const clockEl = document.getElementById('hdrClock');
  if (dateEl) dateEl.textContent = formatHkDate(p);
  if (clockEl) clockEl.textContent = p.hh + ':' + p.mm;
  const key = p.y + '-' + p.m + '-' + p.d;
  if (key !== _lastLunarKey) {
    _lastLunarKey = key;
    updateLunarJieqi(p);
  }
}

function setWeatherUI(temp, cond, humidity, failed, icon) {
  const t = document.getElementById('hdrWeatherTemp');
  const c = document.getElementById('hdrWeatherCond');
  const h = document.getElementById('hdrWeatherHum');
  const ic = document.getElementById('hdrWeatherIcon');
  if (failed) {
    if (t) t.textContent = '天氣暫時未能更新';
    if (c) c.textContent = '';
    if (h) h.textContent = '—';
    if (ic) ic.textContent = '⛅';
    return;
  }
  if (t) t.textContent = temp != null ? (temp + '°C') : '—';
  if (c) c.textContent = cond || '';
  if (h) h.textContent = (humidity != null && humidity !== '') ? (humidity + '%') : '—';
  if (ic) ic.textContent = icon || '⛅';
}

function pickHkoTemp(data) {
  const arr = data && data.temperature && data.temperature.data;
  if (!Array.isArray(arr) || !arr.length) return null;
  const prefer = arr.find(function (x) {
    const p = (x.place || '');
    return p.indexOf('香港天文台') >= 0 || p.indexOf('Hong Kong Observatory') >= 0;
  });
  const row = prefer || arr[0];
  const v = row && row.value;
  return (v === 0 || v) ? v : null;
}

function pickHkoHumidity(data) {
  const arr = data && data.humidity && data.humidity.data;
  if (!Array.isArray(arr) || !arr.length) return null;
  const row = arr[0];
  const v = row && row.value;
  return (v === 0 || v) ? v : null;
}

async function fetchHkoWeather() {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, 10000);
  try {
    const rhrUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
    const res = await fetch(rhrUrl, { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('HKO HTTP ' + res.status);
    const data = await res.json();
    const temp = pickHkoTemp(data);
    const humidity = pickHkoHumidity(data);
    const icon = emojiFromHkoIcon(data && data.icon);
    let cond = '';
    // Prefer short 9-day day-1 weather, else first sentence of flw
    try {
      const fndRes = await fetch(
        'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc',
        { signal: ctrl.signal, cache: 'no-store' }
      );
      if (fndRes.ok) {
        const fnd = await fndRes.json();
        const day0 = fnd.weatherForecast && fnd.weatherForecast[0];
        if (day0 && day0.forecastWeather) {
          cond = String(day0.forecastWeather).trim();
          const cut = cond.indexOf('。');
          if (cut >= 0) cond = cond.slice(0, cut);
        }
      }
    } catch (e) { /* optional */ }
    if (!cond) {
      try {
        const flwRes = await fetch(
          'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc',
          { signal: ctrl.signal, cache: 'no-store' }
        );
        if (flwRes.ok) {
          const flw = await flwRes.json();
          cond = (flw.forecastDesc || '').trim();
          const cut = cond.indexOf('。');
          if (cut >= 0) cond = cond.slice(0, cut);
          if (cond.length > 18) cond = cond.slice(0, 18) + '…';
        }
      } catch (e2) { /* optional */ }
    }
    if (!cond) cond = '天文台實況';
    if (temp == null && !cond) throw new Error('HKO empty');
    return { temp: temp, cond: cond || '實況', humidity: humidity, icon: icon };
  } finally {
    clearTimeout(timer);
  }
}

async function fetchOpenMeteoWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=22.3193&longitude=114.1694&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FHong_Kong';
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('OM HTTP ' + res.status);
  const data = await res.json();
  const cur = data.current || {};
  const code = cur.weather_code;
  const cond = WMO_WEATHER_ZH[code] || ('天氣代碼 ' + code);
  const temp = cur.temperature_2m;
  const humidity = cur.relative_humidity_2m;
  return {
    temp: (temp === 0 || temp) ? Math.round(temp) : null,
    cond: cond,
    humidity: humidity,
    icon: emojiFromWmo(code)
  };
}

async function refreshWeather() {
  const t = document.getElementById('hdrWeatherTemp');
  const c = document.getElementById('hdrWeatherCond');
  const h = document.getElementById('hdrWeatherHum');
  const ic = document.getElementById('hdrWeatherIcon');
  if (t) t.textContent = '載入中…';
  if (c) c.textContent = '';
  if (h) h.textContent = '—';
  if (ic) ic.textContent = '⛅';
  try {

    try {
      w = await fetchHkoWeather();
    } catch (e1) {

    setWeatherUI(null, '', '', true, '⛅');
  }
}

/* ===== Cross-device sync (todos / events) ===== */
function itemSyncTs(item) {
  if (!item || typeof item !== 'object') return 0;
  const u = Number(item.updatedAt);
  if (u) return u;
  const c = Number(item.createdAt);
  return c || 0;
}

function mergeByIdPreferNewer(localArr, remoteArr) {
  if (!Array.isArray(remoteArr) || !remoteArr.length) return { arr: localArr || [], changed: false };
  const local = Array.isArray(localArr) ? localArr.slice() : [];
  const byId = new Map(local.map(x => [x.id, x]));
  let changed = false;
  remoteArr.forEach(remote => {
    if (!remote || !remote.id) return;
    const existing = byId.get(remote.id);
    if (!existing) {
      local.push(remote);
      byId.set(remote.id, remote);
      changed = true;
      return;
    }
    if (itemSyncTs(remote) > itemSyncTs(existing)) {
      const idx = local.findIndex(x => x.id === remote.id);
      if (idx >= 0) {
        local[idx] = remote;
        byId.set(remote.id, remote);
        changed = true;
      }
    }
  });
  return { arr: local, changed };
}

function applyRemoteSyncPayload(remote, opts) {
  opts = opts || {};
  if (!remote || typeof remote !== 'object') return false;
  let changed = false;
  if (Array.isArray(remote.todos)) {
    const r = mergeByIdPreferNewer(state.todos, remote.todos.map(t => {
      const createdAt = t.createdAt || Date.now();
      const out = {
        id: t.id || uid('t'),
        title: String(t.title || ''),
        due: t.due || '',
        done: !!t.done,
        createdAt
      };
      if (t.updatedAt != null) out.updatedAt = t.updatedAt;
      return out;
    }));
    if (r.changed) { state.todos = r.arr; changed = true; }
  }
  if (Array.isArray(remote.events) && remote.events.length) {
    const r = mergeByIdPreferNewer(state.events, remote.events.map(normalizeEvent));
    let next = r.arr;
    const deduped = dedupeEventsByTitleDate(next);
    const dedupeChanged = deduped.length !== next.length;
    if (r.changed || dedupeChanged) { state.events = deduped; changed = true; }
  }
  const remoteUpdated = Number(remote.updatedAt) || 0;
  if (remoteUpdated && remoteUpdated > (Number(state.syncUpdatedAt) || 0)) {
    state.syncUpdatedAt = remoteUpdated;
    changed = true;
  }
  if (opts.applyExtras) {
    // Soft-merge: prefer mergeByIdPreferNewer so empty remote does not wipe phone additions
    if (Array.isArray(remote.shortcuts) && remote.shortcuts.length) {
      const r = mergeByIdPreferNewer(state.shortcuts, remote.shortcuts);
      if (r.changed) { state.shortcuts = r.arr; changed = true; }
    }
    if (Array.isArray(remote.categories)) {
      state.categories = migrateCategories(remote.categories.filter(c => c && c.id !== 'all'));
      changed = true;
    }
    if (Array.isArray(remote.busStops) && remote.busStops.length) {
      const migrated = migrateBusStops(remote.busStops);
      const r = mergeByIdPreferNewer(state.busStops, migrated);
      if (r.changed) { state.busStops = r.arr; changed = true; }
    } else if (Array.isArray(remote.busStops) && !remote.busStops.length) {
      // empty remote: keep local busStops (do not wipe)
    }
    if (remote.theme) { state.theme = remote.theme; changed = true; }
    if (remote.todoTab != null) {
      state.todoTab = normalizeTodoTab(remote.todoTab);
      todoTab = state.todoTab;
      changed = true;
    }
    if (remote.eventsFilter != null) {
      state.eventsFilter = normalizeEventsFilter(remote.eventsFilter);
      changed = true;
    }
  }
  return changed;
}

function reRenderAfterSync(extras) {
  try { renderTodos(); } catch (e) {}
  try { renderEvents(); } catch (e) {}
  try { updateBlockSummaries(); } catch (e) {}
  if (extras) {
    try { applyTheme(state.theme || 'sunny-beach', false); } catch (e) {}
    try { syncTodoTabUI(); } catch (e) {}
    try { syncEventsFilterUI(); } catch (e) {}
    try { renderCatChips(); } catch (e) {}
    try { renderShortcuts(); } catch (e) {}
    try { renderBus(); } catch (e) {}
    try { renderCalendar(); } catch (e) {}
  } else {
    try {
      if (document.getElementById('calGrid')) renderCalendar();
    } catch (e) {}
  }
}

async function autoImportFromCloud() {
  try {
    const res = await fetch('sync-data.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const remote = await res.json();
    if (!remote || remote.updatedAt == null) return;
    // Pages sync-data.json applies busStops/shortcuts/categories/theme too
    const changed = applyRemoteSyncPayload(remote, { applyExtras: true });
    if (changed) {
      saveState();
      reRenderAfterSync(true);
    }
  } catch (e) {
    /* fail silently if 404/offline */
  }
}

function downloadSyncJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'pudding-dashboard-sync.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
}

function formatGdriveSyncTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return hh + ':' + mm;
}

function storeGdriveToken(token) {
  gdriveAccessToken = token || null;
  try {
    if (token) sessionStorage.setItem(GDRIVE_TOKEN_SESSION_KEY, token);
    else sessionStorage.removeItem(GDRIVE_TOKEN_SESSION_KEY);
  } catch (e) {}
}

function restoreGdriveTokenFromSession() {
  try {
    const t = sessionStorage.getItem(GDRIVE_TOKEN_SESSION_KEY);
    if (t) gdriveAccessToken = t;
  } catch (e) {}
  return gdriveAccessToken;
}

function gdriveAuthHeaders() {
  return { Authorization: 'Bearer ' + gdriveAccessToken };
}

async function gdriveApi(url, opts) {
  opts = opts || {};
  const headers = Object.assign({}, gdriveAuthHeaders(), opts.headers || {});
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    const err = new Error('Drive API ' + res.status + (body ? ': ' + body.slice(0, 200) : ''));
    err.status = res.status;
    throw err;
  }
  return res;
}

async function gdriveVerifyOrFindFileId() {
  const stored = localStorage.getItem(GDRIVE_FILE_ID_KEY) || gdriveFileId;
  if (stored) {
    try {
      const res = await gdriveApi('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(stored) + '?fields=id,name,trashed');
      const meta = await res.json();
      if (meta && meta.id && !meta.trashed) {
        gdriveFileId = meta.id;
        localStorage.setItem(GDRIVE_FILE_ID_KEY, meta.id);
        return meta.id;
      }
    } catch (e) {
      /* fall through to list/create */
    }
  }
  const q = "name='" + GDRIVE_SYNC_FILENAME.replace(/'/g, "\\'") + "' and trashed=false";
  const listUrl = 'https://www.googleapis.com/drive/v3/files?spaces=drive&pageSize=10&fields=files(id,name)&q=' + encodeURIComponent(q);
  const listRes = await gdriveApi(listUrl);
  const listData = await listRes.json();
  const found = (listData.files && listData.files[0]) || null;
  if (found && found.id) {
    gdriveFileId = found.id;
    localStorage.setItem(GDRIVE_FILE_ID_KEY, found.id);
    return found.id;
  }
  return await gdriveCreateSyncFile();
}

async function gdriveCreateSyncFile() {
  const payload = buildSyncPayload();
  // Sync covers todos + events + busStops + shortcuts (+ categories/theme in payload)
  if (!Array.isArray(payload.todos)) payload.todos = state.todos || [];
  if (!Array.isArray(payload.events)) payload.events = state.events || [];
  if (!Array.isArray(payload.busStops)) payload.busStops = state.busStops || [];
  if (!Array.isArray(payload.shortcuts)) payload.shortcuts = state.shortcuts || [];
  if (!Array.isArray(payload.categories)) payload.categories = state.categories || [];
  const metadata = { name: GDRIVE_SYNC_FILENAME, mimeType: 'application/json' };
  const boundary = '-------puddingDashBoundary' + Date.now();
  const body =
    '--' + boundary + '\r\n' +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(metadata) + '\r\n' +
    '--' + boundary + '\r\n' +
    'Content-Type: application/json\r\n\r\n' +
    JSON.stringify(payload) + '\r\n' +
    '--' + boundary + '--';
  const res = await gdriveApi(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',
    {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: body
    }
  );
  const meta = await res.json();
  gdriveFileId = meta.id;
  localStorage.setItem(GDRIVE_FILE_ID_KEY, meta.id);
  return meta.id;
}

async function gdrivePull() {
  const fileId = await gdriveVerifyOrFindFileId();
  const res = await gdriveApi('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId) + '?alt=media');
  const remote = await res.json();
  if (!remote || typeof remote !== 'object') return false;
  // Merge todos+events+bus+shortcuts+categories+theme (applyExtras)
  const changed = mergeSyncPayload(remote, { applyExtras: true });
  if (changed) {
    saveState();
    reRenderAfterSync(true);
  }
  return changed;
}

async function gdrivePush() {
  const fileId = await gdriveVerifyOrFindFileId();
  const payload = buildSyncPayload();
  // Sync covers todos + events + busStops + shortcuts (+ categories/theme)
  if (!Array.isArray(payload.todos)) payload.todos = state.todos || [];
  if (!Array.isArray(payload.events)) payload.events = state.events || [];
  if (!Array.isArray(payload.busStops)) payload.busStops = state.busStops || [];
  if (!Array.isArray(payload.shortcuts)) payload.shortcuts = state.shortcuts || [];
  if (!Array.isArray(payload.categories)) payload.categories = state.categories || [];
  await gdriveApi(
    'https://www.googleapis.com/upload/drive/v3/files/' + encodeURIComponent(fileId) + '?uploadType=media',
    {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }
  );
  return true;
}

function scheduleGdriveAutoPush() {
  if (!gdriveIsConnected()) return;
  if (gdriveAutoPushTimer) clearTimeout(gdriveAutoPushTimer);
  gdriveAutoPushTimer = setTimeout(function () {
    gdriveAutoPushTimer = null;
    if (!gdriveIsConnected() || gdriveSyncInFlight) return;
    gdriveSyncInFlight = true;
    gdrivePush()
      .then(function () {
        setGdriveStatus('已同步 ' + formatGdriveSyncTime());
      })
      .catch(function (e) {
        console.warn('GDrive auto-push failed', e);
      })
      .finally(function () {
        gdriveSyncInFlight = false;
      });
  }, 2500);
}

function ensureGdriveTokenClient() {
  if (gdriveTokenClient) return gdriveTokenClient;
  if (!gdriveHasClientId()) return null;
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_OAUTH_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: function (resp) {
      if (resp && resp.access_token) {
        storeGdriveToken(resp.access_token);
        updateGdriveUiConnected(true);
        setGdriveStatus('同步中…');
        gdriveSyncInFlight = true;
        gdrivePull()
          .then(function () {
            // After pull, push so phone/local data uploads to Drive
            return gdrivePush();
          })
          .then(function () {
            setGdriveStatus('已同步 ' + formatGdriveSyncTime());
          })
          .catch(function (e) {
            console.warn('GDrive pull/push after connect failed', e);
            setGdriveStatus('已連接（同步失敗）');
          })
          .finally(function () {
            gdriveSyncInFlight = false;
          });
      } else if (resp && resp.error) {
        setGdriveStatus('授權失敗');
        console.warn('GDrive auth error', resp);
      }
    }
  });
  return gdriveTokenClient;
}

function requestGdriveToken(opts) {
  opts = opts || {};
  const client = ensureGdriveTokenClient();
  if (!client) return false;
  const req = {};
  if (opts.prompt !== undefined) req.prompt = opts.prompt;
  client.requestAccessToken(req);
  return true;
}

async function gdriveSyncNow() {
  if (!gdriveAccessToken) {
    setGdriveStatus('請先連接');
    return;
  }
  setGdriveStatus('同步中…');
  gdriveSyncInFlight = true;
  try {
    await gdrivePull();
    await gdrivePush();
    setGdriveStatus('已同步 ' + formatGdriveSyncTime());
  } catch (e) {
    console.warn('GDrive sync now failed', e);
    setGdriveStatus('同步失敗');
  } finally {
    gdriveSyncInFlight = false;
  }
}

function bindGdriveUi() {
  const connectBtn = document.getElementById('gdriveConnectBtn');
  const syncBtn = document.getElementById('gdriveSyncNowBtn');
  if (connectBtn) {
    connectBtn.addEventListener('click', function () {
      if (!gdriveHasClientId()) {
        alert('尚未設定 Google OAuth Client ID，請稍後再試。');
        setGdriveStatus('待設定 OAuth Client ID');
        return;
      }
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        alert('Google 登入元件尚未載入，請稍後再試。');
        return;
      }
      requestGdriveToken({ prompt: 'consent' });
    });
  }
  if (syncBtn) {
    syncBtn.addEventListener('click', function () {
      gdriveSyncNow();
    });
  }
  if (!gdriveHasClientId()) {
    setGdriveStatus('待設定 OAuth Client ID');
  }
}

function tryGdriveSilentRestore() {
  if (!gdriveHasClientId()) return;
  restoreGdriveTokenFromSession();
  const hasFileId = !!localStorage.getItem(GDRIVE_FILE_ID_KEY);
  if (!gdriveAccessToken && !hasFileId) return;

  function attempt() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      setTimeout(attempt, 400);
      return;
    }
    ensureGdriveTokenClient();
    // Silent token refresh if GIS available; ignore failures
    try {
      const client = gdriveTokenClient;
      if (!client) return;
      const prevCb = client.callback;
      client.callback = function (resp) {
        client.callback = prevCb;
        if (resp && resp.access_token) {
          storeGdriveToken(resp.access_token);
          updateGdriveUiConnected(true);
          gdrivePull()
            .then(function () {
              setGdriveStatus('已同步 ' + formatGdriveSyncTime());
            })
            .catch(function () {
              /* ignore silent pull failures */
              if (gdriveAccessToken) {
                updateGdriveUiConnected(true);
                setGdriveStatus('已連接');
              }
            });
        }
      };
      client.requestAccessToken({ prompt: '' });
    } catch (e) {
      /* ignore */
    }
  }
  attempt();
}


function bindSyncUi() {
  const btnEx = document.getElementById('btnExportData');
  const btnIm = document.getElementById('btnImportData');
  const fileIn = document.getElementById('importFileInput');
  if (btnEx) {
    btnEx.addEventListener('click', () => {
      const payload = buildExportPayload();
      const text = JSON.stringify(payload, null, 2);
      downloadSyncJson(payload, 'pudding-dashboard-sync.json');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      } catch (e) {}
    });
  }
  if (btnIm && fileIn) {
    btnIm.addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', () => {
      const file = fileIn.files && fileIn.files[0];
      fileIn.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const remote = JSON.parse(String(reader.result || ''));
          if (!remote || typeof remote !== 'object') throw new Error('bad json');
          const hasExtras = Array.isArray(remote.shortcuts) || Array.isArray(remote.categories) || Array.isArray(remote.busStops);
          let applyExtras = false;
          if (hasExtras) {
            if (!window.confirm('匯入會合併待辦／活動，並可覆蓋捷徑設定，繼續？')) return;
            applyExtras = true;
          }
          const changed = applyRemoteSyncPayload(remote, { applyExtras });
          if (changed || applyExtras) {
            saveState();
            reRenderAfterSync(applyExtras);
          }
        } catch (err) {
          alert('匯入失敗：檔案格式無效');
        }
      };
      reader.readAsText(file);
    });
  }
}

/* ===== Init ===== */
applyTheme(state.theme || 'sunny-beach', false);
todoTab = normalizeTodoTab(state.todoTab);
syncTodoTabUI();
syncExpandableSections();
bindExpandableHeaders();

renderCatChips();
renderShortcuts();
renderTodos();
syncEventsFilterUI();
renderEvents();
renderCalendar();
renderTraining();
renderBus();
bindBusEtaControls();
if (state.busExpanded) startBusNearbyAndEta(true);
startHeaderInfo();
updateBlockSummaries();
bindSyncUi();
bindGdriveUi();
autoImportFromCloud();
tryGdriveSilentRestore();

/* Hash deep-link: scroll (expand training/bus if targeted) */
scrollToSectionFromHash();
</script>
