  <style>
    /* ===== Themes (sunny-beach / rain-cafe / sky / cloud / clear / dusk / toy) ===== */
    :root {
      --primary: #6B7A88;
      --accent: var(--accent-primary, #C9892A);
      --accent-soft: var(--accent-light, #F5EDE0);
      --lavender: #e8e4f5;
      --pink: #fce8e8;
      --mint: #e0f2ef;
      --yellow: #fef3c7;
      --peach: #ffedd5;
      --lilac: #ede9fe;
      --baby-blue: #e0f2fe;
      --muted: #6B7A88;
      --text: #3A4550;
      --text-strong: #2A333C;
      --border-soft: rgba(107, 138, 158, 0.22);
      --shadow: 0 8px 24px -8px var(--card-shadow, rgba(70, 90, 110, 0.2));
      --radius: 0.5rem;
      --radius-sm: 0.35rem;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --max-w: 100%;
      --app-pad-x: 14px;
      --card: var(--card-bg, rgba(255, 252, 248, 0.72));
      --bg-gradient: linear-gradient(165deg, #DCE6EE 0%, #C5D4E0 42%, #A8B8C8 78%, #B8A890 100%);
      --accent-primary: #C9892A;
      --accent-light: #F5EDE0;
      --accent-badge: #E8D4B0;
      --accent-badge-text: #7A5420;
      --card-bg: rgba(255, 252, 248, 0.72);
      --card-border: rgba(180, 195, 210, 0.55);
      --card-shadow: rgba(70, 90, 110, 0.18);
      --button-bg: linear-gradient(135deg, #6B8A9E, #C9892A);
      --header-bg: rgba(232, 238, 242, 0.88);
      --row-bg: rgba(245, 248, 250, 0.65);
      --surface-2: #E8EEF2;
      --amber: #E8A838;
    }

    /* 天空 — default: soft daytime sky blue + clear blue accent */
    body.theme-sky {
      --bg-gradient: linear-gradient(165deg, #F5FBFE 0%, #E8F4FC 45%, #B8D9F0 100%);
      --accent-primary: #3B82F6;
      --accent-light: #E8F4FC;
      --accent-badge: #BFDBFE;
      --accent-badge-text: #1D4ED8;
      --card-bg: #ffffff;
      --card-border: #D6EBF8;
      --card-shadow: rgba(59, 130, 246, 0.14);
      --button-bg: linear-gradient(135deg, #3B82F6, #60A5FA);
      --accent: #3B82F6;
      --accent-soft: #E8F4FC;
      --text: #334155;
      --text-strong: #1e293b;
      --muted: #64748b;
      --row-bg: #F5FBFE;
      --surface-2: #E8F4FC;
      --header-bg: rgba(255, 255, 255, 0.92);
      --amber: #f59e0b;
      --border-soft: rgba(59, 130, 246, 0.14);
    }
    /* 雲白 — airy white / soft cloud */
    body.theme-cloud {
      --bg-gradient: linear-gradient(165deg, #FFFFFF 0%, #F5FAFD 50%, #E8F4FC 100%);
      --accent-primary: #60A5FA;
      --accent-light: #EFF6FF;
      --accent-badge: #DBEAFE;
      --accent-badge-text: #2563EB;
      --card-bg: #ffffff;
      --card-border: #E2EEF8;
      --card-shadow: rgba(96, 165, 250, 0.12);
      --button-bg: linear-gradient(135deg, #60A5FA, #93C5FD);
      --accent: #60A5FA;
      --accent-soft: #EFF6FF;
      --text: #334155;
      --text-strong: #1e293b;
      --muted: #64748b;
      --row-bg: #F8FBFE;
      --surface-2: #EFF6FF;
      --header-bg: rgba(255, 255, 255, 0.94);
      --amber: #f59e0b;
      --border-soft: rgba(96, 165, 250, 0.14);
    }
    /* 晴空 — brighter clear sky */
    body.theme-clear {
      --bg-gradient: linear-gradient(165deg, #E8F4FC 0%, #D6EBF8 50%, #A8D0EC 100%);
      --accent-primary: #2563EB;
      --accent-light: #DBEAFE;
      --accent-badge: #BFDBFE;
      --accent-badge-text: #1E40AF;
      --card-bg: #ffffff;
      --card-border: #B8D9F0;
      --card-shadow: rgba(37, 99, 235, 0.14);
      --button-bg: linear-gradient(135deg, #2563EB, #3B82F6);
      --accent: #2563EB;
      --accent-soft: #DBEAFE;
      --text: #1e3a5f;
      --text-strong: #0f172a;
      --muted: #5b7394;
      --row-bg: #F0F7FC;
      --surface-2: #DBEAFE;
      --header-bg: rgba(255, 255, 255, 0.92);
      --amber: #f59e0b;
      --border-soft: rgba(37, 99, 235, 0.16);
    }
    /* 暮藍 — soft dusk blue */
    body.theme-dusk {
      --bg-gradient: linear-gradient(165deg, #E8EEF6 0%, #D4E0EF 50%, #B8C9DE 100%);
      --accent-primary: #4F6FA8;
      --accent-light: #E0E8F4;
      --accent-badge: #C9D6EA;
      --accent-badge-text: #334E7A;
      --card-bg: #ffffff;
      --card-border: #C9D6EA;
      --card-shadow: rgba(51, 78, 122, 0.12);
      --button-bg: linear-gradient(135deg, #4F6FA8, #6B8ABC);
      --accent: #4F6FA8;
      --accent-soft: #E0E8F4;
      --text: #2c3e55;
      --text-strong: #1a2740;
      --muted: #6b7c94;
      --row-bg: #F2F5FA;
      --surface-2: #E0E8F4;
      --header-bg: rgba(255, 255, 255, 0.92);
      --amber: #f59e0b;
      --border-soft: rgba(79, 111, 168, 0.16);
    }

    /* 玩具 — Toy Story inspired (Woody/Buzz/Jessie/sky); optional, default stays sky */
    body.theme-toy {
      --bg-gradient: linear-gradient(165deg, #FFFEFA 0%, #E8F4FC 42%, #A8C8E8 100%);
      --accent-primary: #A0673B;
      --accent-light: #FFF6E8;
      --accent-badge: #F5E6C8;
      --accent-badge-text: #6B4423;
      --card-bg: #ffffff;
      --card-border: #E5D4C0;
      --card-shadow: rgba(160, 103, 59, 0.14);
      --button-bg: linear-gradient(135deg, #A0673B, #E8B84A);
      --accent: #A0673B;
      --accent-soft: #FFF6E8;
      --text: #3D2B1F;
      --text-strong: #2C1810;
      --muted: #7A6550;
      --row-bg: #FFFEF8;
      --surface-2: #E8F4FC;
      --header-bg: rgba(255, 254, 250, 0.94);
      --amber: #E8B84A;
      --border-soft: rgba(160, 103, 59, 0.16);
    }

    /* 雨窗 — rainy window cafe: soft blue-grey rain, warm lamp amber, frosted glass, hygge */
    body.theme-rain-cafe {
      /* Dark blue-grey fallback + photo; fixed ::before keeps viewport cover on mobile */
      --bg-gradient: none;
      background-color: #1E2C3A;
      background-image: url('rain-cafe-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* Avoid body background-attachment:fixed (Safari mobile bug); use ::before instead */
      background-attachment: scroll;
      --accent-primary: #C9892A;
      --accent-light: rgba(245, 237, 224, 0.72);
      --accent-badge: #E8D4B0;
      --accent-badge-text: #7A5420;
      --card-bg: rgba(255, 252, 248, 0.42);
      --card-border: rgba(255, 255, 255, 0.28);
      --card-shadow: rgba(20, 35, 55, 0.35);
      --button-bg: linear-gradient(135deg, #6B8A9E, #C9892A);
      --accent: #C9892A;
      --accent-soft: rgba(245, 237, 224, 0.55);
      --text: #2A333C;
      --text-strong: #1E262E;
      --muted: #5A6A78;
      --row-bg: rgba(255, 255, 255, 0.28);
      --surface-2: rgba(255, 255, 255, 0.52);
      --header-bg: rgba(190, 210, 228, 0.42);
      --amber: #E8A838;
      --border-soft: rgba(255, 255, 255, 0.22);
      isolation: isolate;
    }
    /* Fixed full-viewport photo layer (works on mobile; no body attachment:fixed) */
    body.theme-rain-cafe::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: url('rain-cafe-bg.jpg') center / cover no-repeat;
    }
    /* Disable old CSS bokeh orbs — photo provides the lights */
    body.theme-rain-cafe::after {
      content: none;
      display: none;
    }
    body.theme-rain-cafe .app {
      position: relative;
      z-index: 1;
    }
    body.theme-rain-cafe .footer-note {
      color: rgba(220, 232, 242, 0.78);
    }
    /* Frosted translucent glass panels */
    body.theme-rain-cafe .glass-card,
    body.theme-rain-cafe .feature-block {
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 10px 36px -12px rgba(20, 35, 55, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        inset 1px 0 0 rgba(255, 255, 255, 0.16);
    }
    /* Inner card inside feature block stays clear so outer frost shows through */
    body.theme-rain-cafe .block-body-inner > .card.glass-card {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
    body.theme-rain-cafe .page-header {
      background: rgba(200, 218, 232, 0.4);
      backdrop-filter: blur(26px) saturate(1.3);
      -webkit-backdrop-filter: blur(26px) saturate(1.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.26);
      box-shadow:
        0 6px 24px rgba(20, 35, 55, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    body.theme-rain-cafe .hdr-glass {
      background: rgba(255, 250, 244, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        0 4px 16px -6px rgba(20, 35, 55, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    /* Inner rows / chips / modals — rain-cafe frost only */
    body.theme-rain-cafe .todo-item,
    body.theme-rain-cafe .event-item,
    body.theme-rain-cafe .course-card,
    body.theme-rain-cafe .chip:not(.active):not(.cat-manage),
    body.theme-rain-cafe .subtabs {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    body.theme-rain-cafe .bus-card {
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-color: rgba(255, 255, 255, 0.26);
    }
    /* Preserve direction accents; only add frost transparency around skyblue/other gradients */
    body.theme-rain-cafe .bus-card--skyblue {
      border-color: rgba(14, 165, 233, 0.55);
      /* keep skyblue gradient rule; ensure glass blur remains */
    }
    body.theme-rain-cafe .modal {
      background: rgba(255, 252, 248, 0.48);
      backdrop-filter: blur(26px) saturate(1.35);
      -webkit-backdrop-filter: blur(26px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow:
        0 24px 48px -12px rgba(10, 20, 35, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    body.theme-rain-cafe .modal-backdrop {
      background: rgba(12, 22, 36, 0.55);
      backdrop-filter: blur(10px) saturate(1.15);
      -webkit-backdrop-filter: blur(10px) saturate(1.15);
    }
    body.theme-rain-cafe .sc-icon {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    body.theme-rain-cafe .note-banner {
      background: rgba(245, 237, 224, 0.45);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

      --bg-gradient: none;

      --card-shadow: rgba(14, 116, 144, 0.22);
      --button-bg: linear-gradient(135deg, #38BDF8, #E8A020);
      --accent: #E8A020;
      --accent-soft: rgba(253, 230, 138, 0.55);
      --text: #1E3A4C;
      --text-strong: #0F2740;
      --muted: #4A6A7A;
      --row-bg: rgba(255, 255, 255, 0.38);
      --surface-2: rgba(255, 255, 255, 0.58);
      --header-bg: rgba(255, 255, 255, 0.4);
      --amber: #E8A020;
      --border-soft: rgba(255, 255, 255, 0.32);
      isolation: isolate;
    }
    /* Fixed full-viewport photo layer (works on mobile; no body attachment:fixed) */
    body.theme-sunny-beach::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: url('sunny-beach-bg.jpg') center / cover no-repeat;
    }
    /* Disable old CSS bokeh orbs — photo provides the scene */
    body.theme-sunny-beach::after {
      content: none;

    }
    body.theme-sunny-beach .app {
      position: relative;
      z-index: 1;
    }
    body.theme-sunny-beach .footer-note {
      color: rgba(30, 58, 76, 0.85);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.55);
    }
    /* Frosted translucent glass panels — slightly denser for bright beach */
    body.theme-sunny-beach .glass-card,
    body.theme-sunny-beach .feature-block {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 10px 36px -12px rgba(14, 116, 144, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 1px 0 0 rgba(255, 255, 255, 0.2);
    }
    /* Inner card inside feature block stays clear so outer frost shows through */
    body.theme-sunny-beach .block-body-inner > .card.glass-card {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;

    }
    body.theme-sunny-beach .page-header {
      background: rgba(186, 230, 253, 0.42);
      backdrop-filter: blur(26px) saturate(1.3);
      -webkit-backdrop-filter: blur(26px) saturate(1.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.36);
      box-shadow:
        0 6px 24px rgba(14, 116, 144, 0.16),

    body.theme-sunny-beach .hdr-glass {

        0 4px 16px -6px rgba(14, 116, 144, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    /* Inner rows / chips / modals — sunny-beach frost only */
    body.theme-sunny-beach .todo-item,
    body.theme-sunny-beach .event-item,
    body.theme-sunny-beach .course-card,
    body.theme-sunny-beach .chip:not(.active):not(.cat-manage),
    body.theme-sunny-beach .subtabs {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
      border-color: rgba(255, 255, 255, 0.36);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    body.theme-sunny-beach .bus-card {
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);

    }
    /* Preserve direction accents; only add frost transparency around skyblue/other gradients */
    body.theme-sunny-beach .bus-card--skyblue {
      border-color: rgba(14, 165, 233, 0.55);
      /* keep skyblue gradient rule; ensure glass blur remains */
    }
    body.theme-sunny-beach .modal {
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(26px) saturate(1.35);
      -webkit-backdrop-filter: blur(26px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 24px 48px -12px rgba(14, 116, 144, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);

    body.theme-sunny-beach .modal-backdrop {

    body.theme-sunny-beach .note-banner {

    *, *::before, *::after { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(72px + var(--safe-top));
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
    }
    body {
      color-scheme: light;
      margin: 0;
      font-family: 'Noto Sans TC', 'Fredoka', -apple-system, BlinkMacSystemFont, "PingFang HK", "Hiragino Sans CNS", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--safe-top);
      padding-bottom: calc(24px + var(--safe-bottom));
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
      transition: background 0.4s ease, color 0.4s ease;
    }
    /* iOS Safari: fixed background attachment often breaks scrolling/paint under sticky headers */
    @media (max-width: 1023px) {
      body { background-attachment: scroll; }
    }
    /* Mobile: never trap vertical scroll inside shortcuts (or other) inner panes */
    @media (max-width: 639px) {
      #shortcuts .block-body,
      #shortcuts .block-body-inner,
      #todos .block-body-inner,
      #events .block-body-inner,
      #calendar .block-body-inner {
        overflow: visible !important;
        max-height: none !important;
        flex: none !important;
        min-height: 0;
      }
      .shortcut-grid {
        touch-action: pan-y;
      }
    }
    .font-display, .page-header h1, .block-label, .summary-num, .modal h3, .bus-summary {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    .glass-card {
      background: var(--card-bg, #1e293b);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid var(--card-border, #334155);
      box-shadow: 0 6px 18px -8px var(--card-shadow, rgba(0,0,0,0.55));
    }

    .app {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 var(--app-pad-x) 32px;
    }

    /* Fluid content width */
    @media (min-width: 768px) {
      :root {
        --max-w: 1080px;
        --app-pad-x: 20px;
      }
    }
    @media (min-width: 1100px) {
      :root {
        --max-w: 1360px;
        --app-pad-x: 24px;
      }
    }
    @media (min-width: 1440px) {
      :root {
        --max-w: 1520px;
      }
    }

    /* Sticky matte header — industrial */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: 0 calc(-1 * var(--app-pad-x)) 14px;
      padding: 10px var(--app-pad-x) 12px;
      background: var(--header-bg, rgba(15, 23, 42, 0.92));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border, #334155);

    /* Feature sections — responsive CSS grid (wireframe: todo|events|calendar / training+bus|shortcuts) */
    .feature-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 4px;
      align-items: stretch;
    }
    .feature-block {
      background: var(--card-bg, #1e293b);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px -6px var(--card-shadow, rgba(0,0,0,0.4));
      border: 1px solid var(--card-border, #334155);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: auto;
      scroll-margin-top: calc(80px + var(--safe-top));
    }
    .feature-block.is-collapsed {
      height: auto;
      align-self: start;
      flex: 0 0 auto;
    }
    .feature-block.is-collapsed .block-body {
      display: none !important;
      height: 0 !important;
      min-height: 0 !important;
      max-height: 0 !important;
      overflow: hidden !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    /* Training + bus stack: flush when collapsed; full width under todos+events */
    .left-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      max-width: none;
      width: 100%;
      justify-self: stretch;
      align-self: start;
    }
    .left-stack > .feature-block {
      height: auto;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      max-width: none;
      align-self: stretch;
    }
    .left-stack > .feature-block.is-collapsed {
      width: 100%;
      min-width: 0;
      max-width: none;
      align-self: stretch;
      justify-self: stretch;
    }

    /* Mobile / narrow: calendar first, then todos → events → shortcuts → training+bus */
    @media (max-width: 639px) {
      #calendar { grid-row: 1; order: 1; }
      #todos { grid-row: 2; order: 2; }
      #events { grid-row: 3; order: 3; }
      #shortcuts { grid-row: 4; order: 4; }
      #leftStack { grid-row: 5; order: 5; }
    }

    /* Tablet: calendar on top full-width, then 2-col */
    @media (min-width: 640px) and (max-width: 1023px) {
      .feature-stack {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      #calendar { grid-column: 1 / -1; grid-row: 1; }
      #todos { grid-column: 1; grid-row: 2; }
      #events { grid-column: 2; grid-row: 2; }
      #leftStack { grid-column: 1 / -1; grid-row: 3; align-self: start; justify-self: stretch; width: 100%; min-width: 0; max-width: none; }
      #shortcuts { grid-column: 1 / -1; grid-row: 4; align-self: stretch; height: auto; }
      #shortcuts .block-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #shortcuts .block-body-inner {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
    }

    /* Desktop ≥1024: wireframe — todos|events|calendar; training+bus left; shortcuts under calendar */
    @media (min-width: 1024px) {
      .feature-stack {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: 16px;
        align-items: stretch;
      }
      #todos { grid-column: 1; grid-row: 1; }
      #events { grid-column: 2; grid-row: 1; }
      #calendar { grid-column: 3; grid-row: 1; }
      #leftStack { grid-column: 1 / 3; grid-row: 2; align-self: start; justify-self: stretch; width: 100%; min-width: 0; max-width: none; }
      #shortcuts { grid-column: 3; grid-row: 2; min-height: 0; }
      #todos .block-body-inner,
      #events .block-body-inner,
      #calendar .block-body-inner {
        max-height: min(420px, 52vh);
        overflow: auto;
      }
      #shortcuts .block-body-inner {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      #shortcuts .block-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #todos, #events, #calendar, #shortcuts {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100%;
      }
    }

      background: var(--surface-2, #334155);
      color: var(--accent-badge-text, var(--accent-primary));
      box-shadow: 0 2px 8px var(--card-shadow);
    }
    .todo-form, .event-form, .inline-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .form-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .form-row > * { flex: 1 1 auto; }
    input[type="text"], input[type="url"], input[type="date"], input[type="time"], input[type="datetime-local"], select, textarea {
      min-height: 44px;
      padding: 10px 12px;
      border: 1.5px solid var(--card-border, #334155);
      border-radius: 10px;
      font-size: 15px;
      background: var(--row-bg, #0f172a);
      color: var(--text);
      width: 100%;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-light);
      background: var(--row-bg, #0f172a);
    }
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .todo-list, .event-list, .bus-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .course-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 399px) {
      .course-list {
        grid-template-columns: 1fr;
      }
    }
    .todo-item, .event-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      min-height: 32px;
      background: var(--row-bg, #0f172a);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }
    /* Dense body: title line + meta line (+ optional secondary), same as events */
    .todo-item .todo-body,
    .event-item .todo-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: stretch;
    }
    .todo-item .todo-title,
    .event-item .todo-title {
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .todo-item .meta,
    .event-item .meta {
      margin-top: 2px;
      font-size: 11px;
      gap: 6px;
    }
    .todo-item .btn-icon,
    .todo-item .todo-edit,
    .event-item .btn-icon {
      width: 28px;
      height: 28px;
      min-width: 28px;
      padding: 0;
      flex-shrink: 0;
    }
    .todo-item.done { opacity: 0.65; }
    .todo-item.todo-draggable {
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      /* pan-y: allow vertical page scroll; drag handler preventDefault only while dragging */
      touch-action: pan-y;
      transition: opacity .15s, box-shadow .15s, transform .15s;
    }
    .todo-item.todo-draggable:active, .todo-item.todo-draggable.dragging {
      cursor: grabbing;
      opacity: 0.75;
      box-shadow: var(--shadow);
      transform: scale(1.01);
      z-index: 5;
      background: var(--surface-2, #334155);
    }
    .todo-item.drag-over {
      outline: 2px dashed var(--accent-primary);
      outline-offset: 2px;
    }
    .todo-check {
      width: 20px; height: 20px;
      min-width: 20px;
      margin-top: 0;
      accent-color: var(--accent-primary);
      cursor: pointer;
    }
    /* Priority order for incomplete todos (visible filtered list) */
    .todo-num {
      flex-shrink: 0;
      min-width: 1.35rem;
      height: 1.35rem;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--accent-badge-text, #1D4ED8);
      background: var(--accent-badge, #BFDBFE);
      border-radius: 999px;
      box-sizing: border-box;
    }
    .todo-item.done .todo-num {
      display: none;
    }
    .todo-body { flex: 1; min-width: 0; }
    .todo-title {
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.3;
      word-break: break-word;
    }
    .todo-item.done .todo-title { text-decoration: line-through; color: var(--muted); }
    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-ok { background: #14532d; color: #86efac; }
    .badge-warn { background: #422006; color: #fbbf24; }
    .badge-late { background: #450a0a; color: #fca5a5; }
    .badge-soon { background: var(--accent-light); color: var(--accent-badge-text); }
    .badge-note { background: var(--accent-light); color: var(--accent-badge-text); }
    .badge-ongoing { background: #1e3a4f; color: #7dd3fc; }
    .badge-ended { background: #27272a; color: #a1a1aa; }

    .event-work {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .event-item.expanded .event-work {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .event-item .todo-body.event-work-expandable {
      cursor: pointer;
    }
    .todo-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 16px 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty a { color: var(--accent-primary); font-weight: 600; }

    /* Courses */
    .course-card {
      display: block;
      padding: 10px 12px;
      background: var(--row-bg, #0f172a);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      text-decoration: none;
      color: inherit;
      transition: background .15s, transform .12s;
      min-width: 0;
      overflow: hidden;
    }
    .course-card:active { transform: scale(0.99); }
    .course-card:hover { background: var(--accent-light); }
    .course-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }
    .course-title {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
      color: var(--text);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .note-banner {
      background: var(--accent-light);
      color: var(--accent-badge-text);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .link-out {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      min-height: 44px;
    }

    /* Bus — summary + white ETA on one row */
    .bus-card {
      padding: 10px 12px;
      background: var(--card-bg, #ffffff);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      min-width: 0;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
      /* pan-y: allow vertical page scroll; drag handler preventDefault only while dragging */
      touch-action: pan-y;
    }

    /* Direction accents: 東涌/東湧/機場 (sky-blue) vs other (amber/lavender) */
    .bus-card--skyblue {
      border-color: rgba(14, 165, 233, 0.55);
      background:
        linear-gradient(90deg, rgba(56, 189, 248, 0.26) 0%, rgba(186, 230, 253, 0.12) 28%, var(--card-bg, #ffffff) 70%);
      box-shadow: inset 3px 0 0 0 rgba(2, 132, 199, 0.85);
    }
    .bus-card--other {
      border-color: rgba(180, 83, 9, 0.42);
      background:
        linear-gradient(90deg, rgba(251, 191, 36, 0.22) 0%, rgba(253, 230, 138, 0.10) 28%, var(--card-bg, #ffffff) 70%);
      box-shadow: inset 3px 0 0 0 rgba(217, 119, 6, 0.78);
    }
    body.theme-dusk .bus-card--other,
    body.theme-sky .bus-card--other,
    body.theme-cloud .bus-card--other,
    body.theme-clear .bus-card--other {
      border-color: rgba(139, 92, 246, 0.42);
      background:
        linear-gradient(90deg, rgba(196, 181, 253, 0.28) 0%, rgba(237, 233, 254, 0.14) 28%, var(--card-bg, #ffffff) 70%);
      box-shadow: inset 3px 0 0 0 rgba(124, 58, 237, 0.72);
    }
    .bus-card:active, .bus-card:focus-visible {
      border-color: var(--accent-primary, #3B82F6);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.22);
      outline: none;
    }
    .bus-card.dragging {
      opacity: 0.72;
      transform: scale(1.02);
      box-shadow: 0 8px 20px -6px var(--card-shadow, rgba(59, 130, 246, 0.28));
      z-index: 2;
      touch-action: none;
    }
    .bus-card.drag-over {
      border-color: var(--accent-primary, #3B82F6);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.28);
    }
    .bus-card .bus-del {
      flex: 0 0 auto;
      padding: 4px 6px;
      min-height: 28px;
      font-size: 13px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .bus-card .bus-del:hover, .bus-card .bus-del:focus-visible {
      color: #b91c1c;
      background: #fef2f2;
      outline: none;
    }
    .bus-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .bus-summary {
      flex: 1 1 auto;
      min-width: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-strong, #1e293b);
      letter-spacing: 0.02em;
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      text-overflow: ellipsis;
      line-height: 1.35;
      max-height: calc(1.35em * 2);
    }
    .bus-eta {
      flex: 0 0 auto;
      margin-top: 0;
      font-size: 12px;
      color: #ffffff;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      border-radius: 999px;
      padding: 4px 10px;
      line-height: 1.35;
      min-height: 0;
      max-width: 34%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
    }
    .bus-eta.is-loading { opacity: 0.8; }
    .bus-eta.is-error {
      color: #ffffff;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.28);
    }
    .bus-eta .eta-times {
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.01em;
    }
    .bus-eta .eta-rmk {
      display: inline;
      margin-left: 4px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      font-size: 11px;
    }
    #bus .section-toolbar {
      margin-bottom: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    #bus .section-toolbar .bus-toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    #bus .section-toolbar > .btn.btn-sm,
    #bus .section-toolbar .bus-toolbar-right > .btn.btn-sm {
      min-height: 32px;
      padding: 4px 10px;
      font-size: 12px;
    }
    .bus-list-hint {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .bus-add-status {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      min-height: 1.2em;
    }
    .bus-add-status.is-error { color: #b45309; }
    .bus-add-status.is-ok { color: var(--accent-badge-text, #1D4ED8); }
    .bus-card-main {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bus-card-meta {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted, #64748b);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bus-op-badge {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      vertical-align: middle;
      line-height: 1.4;
    }
    .bus-op-badge.is-kmb {
      color: #9a3412;
      background: #ffedd5;
    }
    .bus-op-badge.is-ctb {
      color: #1d4ed8;
      background: #dbeafe;
    }
    .bus-summary-row {
      display: flex;
      align-items: flex-start;
      gap: 0;
      min-width: 0;
    }
    .bus-summary-row .bus-op-badge {
      margin-top: 2px;
      flex: 0 0 auto;
    }
    .bus-summary-row .bus-summary {
      flex: 1 1 auto;
    }
    #busServiceTypeField.is-hidden { display: none; }
    .bus-card-affordance {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-badge-text, #1D4ED8);
      white-space: nowrap;
      padding-left: 2px;
    }
    .bus-card-affordance .chev {
      font-size: 14px;
      line-height: 1;
      opacity: 0.85;
    }
    @media (max-width: 400px) {
      .bus-card-affordance span:not(.chev) { display: none; }
      .bus-eta { max-width: 36%; }
      .bus-card-main { flex: 1 1 58%; }
    }
    .bus-route-sheet .bus-route-hint {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted, #64748b);
    }
    .bus-route-dir {
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-strong, #1e293b);
    }
    .bus-route-dir.is-watched::after {
      content: '（此卡方向）';
      font-weight: 500;
      color: var(--accent-badge-text, #1D4ED8);
      font-size: 11px;
      margin-left: 4px;
    }
    .bus-route-stops {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: min(55vh, 420px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding-right: 2px;
    }
    .bus-route-stop {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      background: var(--row-bg, #F5FBFE);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      font-size: 13px;
    }
    .bus-route-stop.is-nearby {
      border-color: var(--accent-primary, #3B82F6);
      background: var(--accent-light, #E8F4FC);
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.18);
    }
    .bus-route-stop .seq {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: var(--muted, #64748b);
      text-align: center;
    }
    .bus-route-stop .name {
      min-width: 0;
      font-weight: 600;
      color: var(--text-strong, #1e293b);
      line-height: 1.3;
    }
    .bus-route-stop .name .near-tag {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-badge-text, #1D4ED8);
      background: var(--accent-badge, #BFDBFE);
      border-radius: 999px;
      padding: 1px 6px;
      vertical-align: middle;
    }
    .bus-route-stop .eta-col {
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-badge-text, #1D4ED8);
      white-space: nowrap;
      max-width: 42vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bus-route-stop .eta-col .rmk {
      display: block;
      font-weight: 400;
      font-size: 10px;
      color: var(--muted, #64748b);
      margin-top: 1px;
    }
    .bus-route-empty, .bus-route-loading, .bus-route-error {
      padding: 14px 10px;
      text-align: center;
      font-size: 13px;
      color: var(--muted, #64748b);
    }
    .bus-route-error { color: #b45309; }

    /* Modal — industrial panel */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 560px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: var(--card-bg, #1e293b);
      color: var(--text);
      width: 100%;
      max-width: min(480px, 100%);
      border-radius: 1rem 1rem 0 0;
      border: 1px solid var(--card-border, #334155);
      padding: 18px 16px calc(16px + var(--safe-bottom));
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform .25s;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      margin: 0 auto;
    }
    @media (min-width: 560px) {
      .modal { border-radius: 1rem; transform: translateY(10px); }
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal h3 {
      margin: 0 0 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-strong, #f8fafc);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; }
    .form-stack { display: flex; flex-direction: column; gap: 12px; }

    .cat-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .cat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--row-bg, #0f172a);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
    }
    .cat-row span { flex: 1; font-weight: 600; font-size: 14px; }


    /* ===== Month calendar ===== */
    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cal-month-label {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-strong, #f8fafc);
      letter-spacing: -0.02em;
    }
    .cal-nav {
      display: flex;
      gap: 4px;
    }
    .cal-nav .btn {
      min-width: 36px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 4px;
    }
    .cal-weekday {
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      padding: 4px 0;
    }
    .cal-weekday.sun { color: #f87171; }
    .cal-weekday.sat { color: #38bdf8; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-day {
      aspect-ratio: 1;
      min-height: 0;
      border: none;
      border-radius: 8px;
      background: var(--row-bg, #0f172a);
      cursor: pointer;
      padding: 4px 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      font-family: inherit;
      color: var(--text, #f1f5f9);
      transition: background .12s, box-shadow .12s, transform .1s;
    }
    .cal-day:hover { background: var(--accent-light); }
    .cal-day:active { transform: scale(0.96); }
    .cal-day.other-month {
      opacity: 0.35;
    }
    .cal-day.today {
      box-shadow: inset 0 0 0 2px var(--amber, var(--accent-primary));
      background: var(--surface-2, #334155);
    }
    .cal-day.selected {
      background: var(--accent-light);
      box-shadow: 0 0 0 2px var(--accent-primary);
    }
    .cal-day-num {
      font-size: 0.75rem;
      font-weight: 700;

function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function todayLocal() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function parseDateOnly(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}

function daysDiff(dateObj) {
  if (!dateObj) return null;
  const t = todayLocal();
  return Math.round((dateObj - t) / 86400000);
}

function formatDays(n) {
  if (n == null) return '';
  if (n < 0) return '<span class="badge badge-late">已過期 ' + Math.abs(n) + ' 日</span>';
  if (n === 0) return '<span class="badge badge-warn">今日</span>';
  if (n === 1) return '<span class="badge badge-soon">尚餘 1 日</span>';
  if (n <= 7) return '<span class="badge badge-soon">尚餘 ' + n + ' 日</span>';
  return '<span class="badge badge-ok">尚餘 ' + n + ' 日</span>';
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatYMD(d) {
  if (!d) return '';
  return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
}

function formatEventDateTime(dateStr, timeStr) {
  const d = parseDateOnly(dateStr);
  if (!d) return escapeHtml(dateStr || '');
  let out = escapeHtml(formatYMD(d));
  if (timeStr) out += ' · ' + escapeHtml(timeStr);
  return out;
}

function formatEventStatus(dateStr) {
  const d = parseDateOnly(dateStr);
  if (!d) return '';
  return formatDays(daysDiff(d));
}

function normalizeEvent(e) {
  const title = String((e && e.title) || '');
  let date = '';
  let time = '';
  let work = '';
  if (e) {
    if (e.date) date = String(e.date);
    else if (e.from) date = String(e.from);
    time = String(e.time || '');
    work = String(e.work != null ? e.work : '');
  }
  // Normalize date to YYYY-MM-DD if parseable
  const parsed = parseDateOnly(date);
  if (parsed) {
    date = parsed.getFullYear() + '-' + pad2(parsed.getMonth() + 1) + '-' + pad2(parsed.getDate());
  }
  if (time && !/^\d{1,2}:\d{2}/.test(time)) time = '';
  else if (time) {
    const m = time.match(/^(\d{1,2}):(\d{2})/);
    if (m) time = pad2(+m[1]) + ':' + pad2(+m[2]);
  }
  const out = { id: (e && e.id) || uid('e'), title, date, time, work };
  if (e && e.updatedAt != null) out.updatedAt = e.updatedAt;
  if (e && e.createdAt != null) out.createdAt = e.createdAt;
  return out;
}

const EVENTS_FILTERS = ['today', 'tomorrow', 'dayAfter', 'week', 'month'];

function normalizeEventsFilter(raw) {
  if (EVENTS_FILTERS.includes(raw)) return raw;
  // Migrate old eventsViewDays
  if (raw && typeof raw === 'object' && raw.mode === 'custom') return 'month';
  const n = Number(raw);
  if (n === 30 || n === 60 || n === 90) return 'month';
  return 'today';
}

const TODO_TABS = ['today', 'tomorrow', 'week'];

function normalizeTodoTab(raw) {
  return TODO_TABS.includes(raw) ? raw : 'today';
}

function addDaysYMD(baseDate, days) {
  const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + days);
  return d;
}

function toYMD(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function getEventsFilterRange(filter) {
  const today = todayLocal();
  const f = EVENTS_FILTERS.includes(filter) ? filter : 'today';
  if (f === 'today') return { start: today, end: today, label: '今天' };
  if (f === 'tomorrow') {
    const t = addDaysYMD(today, 1);
    return { start: t, end: t, label: '明天' };
  }
  if (f === 'dayAfter') {
    const t = addDaysYMD(today, 2);
    return { start: t, end: t, label: '後天' };
  }
  if (f === 'week') {
    return { start: today, end: addDaysYMD(today, 6), label: '一周內' };
  }
  // month: today through today+29 (rolling 30 days including today)
  return { start: today, end: addDaysYMD(today, 29), label: '一個月內' };
}

function eventOnDate(ev, day) {
  const d = parseDateOnly(ev.date);
  if (!d || !day) return false;
  return d.getFullYear() === day.getFullYear() && d.getMonth() === day.getMonth() && d.getDate() === day.getDate();
}

function eventInFilter(ev, filter) {
  const d = parseDateOnly(ev.date);
  if (!d) return false;
  const win = getEventsFilterRange(filter);
  return d >= win.start && d <= win.end;
}

function countEventsToday() {
  const today = todayLocal();
  return (state.events || []).filter(ev => eventOnDate(ev, today)).length;
}

function eventsFilterHintText() {
  const win = getEventsFilterRange(state.eventsFilter);
  return '顯示' + win.label + '的活動';
}

function eventsFilterEmptyText() {
  const win = getEventsFilterRange(state.eventsFilter);
  return win.label + '暫無活動';
}

}

  const op = String((b && b.operator) || '').trim().toUpperCase();
  if (op === 'CTB' || op === 'CITYBUS' || op === 'NWFB') return 'CTB';
  if (op === 'KMB' || op === 'LWB') return 'KMB';
  if (b && String(b.ctbStopId || '').trim() && !String(b.kmbStopId || '').trim()) return 'CTB';
  return 'KMB';
}

function resolveCtbStopId(b) {
  if (!b) return '';
  const existing = String(b.ctbStopId || '').trim();
  if (existing) return existing;
  // Citybus stop ids are 6-digit; allow stopId fallback when it looks like one
  const code = String(b.stopId || '').trim();
  if (/^\d{6}$/.test(code)) return code;
  return '';
}

function resolveStopApiId(b) {
  if (resolveBusOperator(b) === 'CTB') return resolveCtbStopId(b);
  return resolveKmbStopId(b);
}

function busEtaCacheKey(b) {
  const op = resolveBusOperator(b);
  const stop = resolveStopApiId(b);
  if (!stop) return '';
  if (op === 'CTB') {
    return 'CTB|' + stop + '|' + String((b && b.route) || '').trim().toUpperCase();
  }
  return 'KMB|' + stop;
}

function busOperatorBadgeHtml(b) {
  const op = resolveBusOperator(b);
  if (op === 'CTB') {
    return '<span class="bus-op-badge is-ctb" title="城巴">城巴</span>';
  }
  return '<span class="bus-op-badge is-kmb" title="九巴／龍運">九巴</span>';
}

function resolveBusDestKeywords(b) {
  if (Array.isArray(b && b.destKeywords) && b.destKeywords.length) {
    return b.destKeywords.map(String);
  }
  const seed = SEED_BUS.find(s => s.id === (b && b.id));
  if (seed && Array.isArray(seed.destKeywords)) return seed.destKeywords.slice();
  const d = String((b && b.direction) || '');
  const keys = [];
  if (d.includes('元朗')) keys.push('元朗');
  if (d.includes('東涌')) keys.push('東涌');
  if (d.includes('機場')) keys.push('機場');
  if (d.includes('高鐵') || d.includes('西九')) keys.push('高鐵', '西九');
  if (d.includes('旺角') || d.includes('柏景')) keys.push('旺角', '柏景');
  return keys;
}

function resolveBusApiDir(b) {
  const explicit = String((b && b.apiDir) || '').trim().toUpperCase();
  if (explicit === 'O' || explicit === 'I') return explicit;
  const seed = SEED_BUS.find(s => s.id === (b && b.id));
  if (seed && (seed.apiDir === 'O' || seed.apiDir === 'I')) return seed.apiDir;
  const d = String((b && b.direction) || '');
  if (d.includes('元朗')) return 'I';
  if (d.includes('東涌') || d.includes('機場') || d.includes('高鐵') || d.includes('西九') || d.includes('旺角') || d.includes('柏景')) {
    return 'O';
  }
  return '';
}

function normalizeBusEntry(b, fallbackId) {
  const base = {
    id: (b && b.id) || fallbackId || uid('bus'),
    route: String((b && b.route) || ''),
    operator: resolveBusOperator(b),
    direction: String((b && b.direction) || ''),
    stopName: String((b && (b.stopName || b.stop)) || ''),
    stopId: String((b && b.stopId) || ''),
    kmbStopId: String((b && b.kmbStopId) || ''),
    ctbStopId: String((b && b.ctbStopId) || ''),
    destKeywords: Array.isArray(b && b.destKeywords) ? b.destKeywords.map(String) : undefined,
    apiDir: String((b && b.apiDir) || '')
  };
  if (b && b.nearbyDistM != null && Number.isFinite(Number(b.nearbyDistM))) {
    base.nearbyDistM = Math.round(Number(b.nearbyDistM));
  }
  if (b && b.nearbySeq != null && Number.isFinite(Number(b.nearbySeq))) {
    base.nearbySeq = Number(b.nearbySeq);
  }
  if (b && b.serviceType != null && String(b.serviceType).trim() !== '') {
    base.serviceType = Number(b.serviceType) || b.serviceType;
  }
  if (base.operator === 'CTB') {
    if (!base.ctbStopId) base.ctbStopId = resolveCtbStopId(base);
    base.kmbStopId = '';
  } else {
    if (!base.kmbStopId) base.kmbStopId = resolveKmbStopId(base);
  }
  if (!base.destKeywords || !base.destKeywords.length) {
    const kw = resolveBusDestKeywords(base);
    if (kw.length) base.destKeywords = kw;
  }
  if (!base.apiDir) {
    const dir = resolveBusApiDir(base);
    if (dir) base.apiDir = dir;
  }
  return base;
}

/** Migrate old route-keyed object → array; seed only on first load; then persist user order/edits/deletes. */
function migrateBusStops(raw) {
  // Persisted array: keep order, allow deletes (do not re-inject missing seeds)
  if (Array.isArray(raw)) {
    const out = [];
    const seen = {};
    raw.forEach(b => {
      const n = normalizeBusEntry(b);
      if (!n.id || seen[n.id]) return;
      if (!(n.route || n.stopName || n.stopId || n.kmbStopId || n.ctbStopId)) return;
      // Fill blanks from seed when this id is a known preset
      const seed = SEED_BUS.find(s => s.id === n.id);
      if (seed) {
        n.route = n.route || seed.route;
        n.operator = n.operator || seed.operator || 'KMB';
        n.direction = n.direction || seed.direction;
        n.stopName = n.stopName || seed.stopName;
        n.stopId = n.stopId || seed.stopId;
        n.kmbStopId = n.kmbStopId || seed.kmbStopId;
        n.ctbStopId = n.ctbStopId || seed.ctbStopId || '';
        if (!n.destKeywords || !n.destKeywords.length) n.destKeywords = seed.destKeywords.slice();
        n.apiDir = n.apiDir || seed.apiDir;
        if (n.operator === 'CTB') {
          if (!n.ctbStopId) n.ctbStopId = resolveCtbStopId(n);
        } else if (!n.kmbStopId) {
          n.kmbStopId = resolveKmbStopId(n);
        }
      }
      seen[n.id] = true;
      out.push(n);
    });
    return out;
  }
  // Old object keyed by route — soft merge into seeds (first load / legacy)
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
    const seeded = cloneSeedBus();
    Object.keys(raw).forEach(route => {
      const u = raw[route] || {};
      const stopId = String(u.stopId || '').trim();
      const stopName = String(u.stopName || '').trim();
      if (!stopId && !stopName) return;
      const match = seeded.find(s => s.route === route && (!stopId || s.stopId === stopId));
      if (match) {
        if (stopName) match.stopName = stopName;
        if (stopId) {
          match.stopId = stopId;
          match.kmbStopId = resolveKmbStopId(match);
        }
      }
    });
    return seeded;
  }
  // Missing / null → seed defaults (first load)
  return cloneSeedBus();
}


/** Normalize event title for dedupe (trim + collapse whitespace). */
function normEventTitle(t) {
  return String(t || '').trim().replace(/\s+/g, ' ');
}

/** Same school activity: title + date; time soft-matches if either empty. */
function eventsSameTitleDate(a, b) {
  if (!a || !b) return false;
  if (normEventTitle(a.title) !== normEventTitle(b.title)) return false;
  if (String(a.date || '') !== String(b.date || '')) return false;
  const ta = String(a.time || '');
  const tb = String(b.time || '');
  if (!ta || !tb) return true;
  return ta === tb;
}

/**
 * One-pass dedupe: same title+date(+soft time) → keep ONE.
 * Prefer non-empty work, else e_seed_* id, else newer updatedAt.
 */
function dedupeEventsByTitleDate(events) {
  if (!Array.isArray(events) || events.length < 2) return events || [];
  const kept = [];
  events.forEach(ev => {
    if (!ev) return;
    const idx = kept.findIndex(k => eventsSameTitleDate(k, ev));
    if (idx < 0) {
      kept.push(ev);
      return;
    }
    const cur = kept[idx];
    const curWork = String(cur.work || '').trim();
    const evWork = String(ev.work || '').trim();
    let preferEv = false;
    if (evWork && !curWork) preferEv = true;
    else if (curWork && !evWork) preferEv = false;
    else if (String(ev.id || '').indexOf('e_seed_') === 0 && String(cur.id || '').indexOf('e_seed_') !== 0) preferEv = true;
    else if (String(cur.id || '').indexOf('e_seed_') === 0 && String(ev.id || '').indexOf('e_seed_') !== 0) preferEv = false;
    else {
      const evTs = Number(ev.updatedAt) || Number(ev.createdAt) || 0;
      const curTs = Number(cur.updatedAt) || Number(cur.createdAt) || 0;
      if (evTs > curTs) preferEv = true;
    }
    if (preferEv) {
      // Keep richer work if winner somehow empty and loser has work
      if (!String(ev.work || '').trim() && curWork) ev = Object.assign({}, ev, { work: cur.work });
      if (!String(ev.time || '') && cur.time) ev = Object.assign({}, ev, { time: cur.time });
      kept[idx] = ev;
    } else {
      if (!curWork && evWork) kept[idx] = Object.assign({}, cur, { work: ev.work });
      if (!String(cur.time || '') && ev.time) kept[idx] = Object.assign({}, kept[idx], { time: ev.time });
    }
  });
  return kept;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      return normalizeState(data);
    }
  } catch (e) {}
  return normalizeState(null);
}

function migrateCategories(cats) {
  return (cats || []).map(c => {
    const id = String(c.id);
    let name = String(c.name || '');
    if (id === 'life' || name === '生活') name = '個人';
    return { id, name };
  });
}

function normalizeState(data) {
  const base = {
    schemaVersion: SCHEMA_VERSION,
    shortcuts: SEED_SHORTCUTS.map(s => ({ ...s })),
    categories: DEFAULT_CATS.filter(c => !c.system).map(c => ({ ...c })),
    todos: [],
    events: SEED_EVENTS.map(e => normalizeEvent({ ...e })),
    eventsFilter: 'today',
    busStops: cloneSeedBus(),
    expandedSection: null,
    trainingExpanded: false,
    busExpanded: false,
    todoTab: 'today',
    theme: 'sunny-beach',
    syncUpdatedAt: 0
  };
  if (!data || typeof data !== 'object') return base;

  const prevSchema = Number(data.schemaVersion) || 0;
  const upgradeToV4 = prevSchema < 4;

  if (upgradeToV4) {
    // New defaults for shortcuts + ensure 工作／學校／個人
    base.shortcuts = SEED_SHORTCUTS.map(s => ({ ...s }));
    base.categories = ensureDefaultCategories(
      Array.isArray(data.categories)
        ? data.categories.filter(c => c && c.id !== 'all')
        : base.categories
    );
  } else {
    // schema >= 4: keep user's shortcuts / categories as stored
    if (Array.isArray(data.shortcuts) && data.shortcuts.length) {
      base.shortcuts = data.shortcuts.map(s => ({
        id: s.id || uid('s'),
        title: String(s.title || ''),
        url: String(s.url || ''),
        category: s.category || 'life'
      }));
    } else if (Array.isArray(data.shortcuts) && !data.shortcuts.length) {
      base.shortcuts = [];
    }
    if (Array.isArray(data.categories)) {
      base.categories = migrateCategories(
        data.categories.filter(c => c && c.id !== 'all')
      );
    }
  }

  if (Array.isArray(data.todos)) {
    base.todos = data.todos.map(t => {
      const createdAt = t.createdAt || Date.now();
      const out = {
        id: t.id || uid('t'),
        title: String(t.title || ''),
        due: t.due || '',
        done: !!t.done,
        createdAt
      };
      if (t.updatedAt != null) out.updatedAt = t.updatedAt;
      return out;
    });
  }
  // Ensure seeded todos exist (stable id); do not wipe user todos
  {
    const have = new Set(base.todos.map(t => t.id));
    SEED_TODOS.forEach(seed => {
      if (!have.has(seed.id)) base.todos.push({ ...seed });
    });
  }
  if (data.syncUpdatedAt != null) base.syncUpdatedAt = data.syncUpdatedAt;
  if (Array.isArray(data.events)) {
    base.events = data.events.map(normalizeEvent);
  } else {
    base.events = SEED_EVENTS.map(e => normalizeEvent({ ...e }));
  }
  // Ensure seeded school events exist (stable id) for Pages / returning users.
  // Also skip when user already has same title+date (soft time) under a different id —
  // otherwise phone localStorage copies of seeds duplicate (e.g. Siufan共備).
  // When skipping, enrich empty work/time from the seed so user copies gain seed text.
  {
    const have = new Set(base.events.map(e => e.id));
    SEED_EVENTS.forEach(seed => {
      const n = normalizeEvent({ ...seed });
      if (have.has(n.id)) return;
      const matchIdx = base.events.findIndex(e => eventsSameTitleDate(e, n));
      if (matchIdx >= 0) {
        const cur = base.events[matchIdx];
        const patch = {};
        if (!String(cur.work || '').trim() && String(n.work || '').trim()) patch.work = n.work;
        if (!String(cur.time || '') && n.time) patch.time = n.time;
        if (Object.keys(patch).length) {
          base.events[matchIdx] = Object.assign({}, cur, patch);
        }
        return;
      }
      base.events.push(n);
      have.add(n.id);
    });
  }
  base.events = dedupeEventsByTitleDate(base.events);
  // Prefer new key; migrate old eventsViewDays
  if (data.eventsFilter != null) {
    base.eventsFilter = normalizeEventsFilter(data.eventsFilter);
  } else if (data.eventsViewDays != null) {
    base.eventsFilter = normalizeEventsFilter(data.eventsViewDays);
  } else {
    base.eventsFilter = 'today';
  }
  base.busStops = migrateBusStops(data.busStops);
  const exp = data.expandedSection;
  base.expandedSection = (exp === null || exp === undefined || exp === '')
    ? null
    : (['shortcuts', 'todos', 'events', 'training', 'bus', 'calendar'].includes(exp) ? exp : null);
  base.trainingExpanded = !!data.trainingExpanded;
  base.busExpanded = !!data.busExpanded;
  base.todoTab = normalizeTodoTab(data.todoTab);
  const THEMES = ['sunny-beach', 'rain-cafe', 'sky', 'cloud', 'clear', 'dusk', 'toy'];
  const THEME_MIGRATE = {
    mist: 'sky', mint: 'cloud', sand: 'clear', lilac: 'dusk',
    steel: 'sky', navy: 'sky', charcoal: 'cloud', copper: 'clear',
    linen: 'clear', olive: 'cloud', ink: 'dusk',
    slate: 'sky', graphite: 'sky', amber: 'clear',
    sakura: 'dusk', peach: 'clear', twilight: 'dusk', matcha: 'cloud',
    toys: 'toy'
  };
  const rawTheme = THEME_MIGRATE[data.theme] || data.theme;
  base.theme = THEMES.includes(rawTheme) ? rawTheme : 'sunny-beach';
  // One-shot (schema < 5): force rain-cafe so users stuck on an old theme see the frost look.
  // After save, schema is 5 and theme chips work as usual.
  if (prevSchema < 5) {
    base.theme = 'rain-cafe';
  }
  // One-shot (schema < 6): force sunny-beach so users see the beach photo frost look once.
  // After save, schema is 6 and theme chips work as usual.
  if (prevSchema < 6) {
    base.theme = 'sunny-beach';
  }
  base.schemaVersion = SCHEMA_VERSION;
  return base;
}

function buildExportPayload() {
  return {
    updatedAt: Date.now(),
    schemaVersion: SCHEMA_VERSION,
    todos: Array.isArray(state.todos) ? state.todos : [],
    events: Array.isArray(state.events) ? state.events : [],
    shortcuts: Array.isArray(state.shortcuts) ? state.shortcuts : [],
    categories: Array.isArray(state.categories) ? state.categories : [],
    busStops: Array.isArray(state.busStops) ? state.busStops : [],
    theme: state.theme || 'sunny-beach',
    todoTab: normalizeTodoTab(typeof todoTab !== 'undefined' ? todoTab : state.todoTab),
    eventsFilter: state.eventsFilter || 'today',
    syncUpdatedAt: state.syncUpdatedAt || 0
  };
}

/** Same payload as 匯出資料 — todos + events + busStops + shortcuts + categories + theme. */
function buildSyncPayload() {
  return buildExportPayload();
}

/** Merge remote sync JSON (todos/events/bus/shortcuts by id when applyExtras); GDrive / import. */
function mergeSyncPayload(remote, opts) {
  return applyRemoteSyncPayload(remote, opts || { applyExtras: false });
}

function saveState() {
  try {
    const payload = {
      schemaVersion: SCHEMA_VERSION,
      shortcuts: state.shortcuts,
      categories: state.categories,
      todos: state.todos,
      events: state.events,
      eventsFilter: state.eventsFilter || 'today',
      busStops: state.busStops,
      trainingExpanded: !!state.trainingExpanded,
      busExpanded: !!state.busExpanded,
      todoTab: normalizeTodoTab(todoTab),
      theme: state.theme || 'sunny-beach',
      syncUpdatedAt: state.syncUpdatedAt || 0
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    try {
      localStorage.setItem(STORAGE_KEY + '-export', JSON.stringify(buildExportPayload()));
    } catch (e2) {}
  } catch (e) {
    console.warn('localStorage save failed', e);
  }
  try { updateBlockSummaries(); } catch (e) {}
  try {
    if (document.getElementById('calGrid')) renderCalendar();
  } catch (e) {}
  try { scheduleGdriveAutoPush(); } catch (e) {}
}


/* ===== Theme ===== */
const THEME_PRESETS = ['sunny-beach', 'rain-cafe', 'sky', 'cloud', 'clear', 'dusk', 'toy'];

function applyTheme(preset, persist) {
  const t = THEME_PRESETS.includes(preset) ? preset : 'sunny-beach';
  state.theme = t;
  const body = document.getElementById('appBody') || document.body;
  THEME_PRESETS.forEach(p => body.classList.remove('theme-' + p));
  body.classList.add('theme-' + t);
  document.querySelectorAll('.theme-chips .theme-chip').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-theme') === t);
  });
  const meta = document.querySelector('meta[name="theme-color"]');
  const colors = { 'sunny-beach': '#87CEEB', 'rain-cafe': '#C5D4E0', sky: '#E8F4FC', cloud: '#F5FAFD', clear: '#D6EBF8', dusk: '#D4E0EF', toy: '#E8F4FC' };
  if (meta) meta.setAttribute('content', colors[t] || '#87CEEB');
  if (persist !== false) saveState();
}

document.querySelectorAll('.theme-chips').forEach(function (group) {
  group.addEventListener('click', function (e) {
    const btn = e.target.closest('.theme-chip');
    if (!btn) return;
    applyTheme(btn.getAttribute('data-theme'), true);
  });
});

function allCategories() {
  return [{ id: 'all', name: '全部', system: true }, ...state.categories];
}

function summaryNumHtml(n, unit) {

function applyExpandableSection(id, expanded) {
  const sec = document.getElementById(id);
  const hdr = document.getElementById('hdr-' + id);
  const body = document.getElementById('body-' + id);
  if (!sec || !hdr || !body) return;
  if (expanded) {
    sec.classList.remove('is-collapsed');
    body.hidden = false;
    hdr.setAttribute('aria-expanded', 'true');
  } else {
    sec.classList.add('is-collapsed');
    body.hidden = true;
    hdr.setAttribute('aria-expanded', 'false');
  }
}

function syncExpandableSections() {
  applyExpandableSection('training', !!state.trainingExpanded);
  applyExpandableSection('bus', !!state.busExpanded);
}

function toggleExpandableSection(id) {
  if (id === 'training') {
    state.trainingExpanded = !state.trainingExpanded;
    applyExpandableSection('training', state.trainingExpanded);
  } else if (id === 'bus') {
    state.busExpanded = !state.busExpanded;
    applyExpandableSection('bus', state.busExpanded);
    if (state.busExpanded) startBusNearbyAndEta(true);
    else stopBusEtaAutoRefresh();
  } else {
    return;
  }
  saveState();
}

function bindExpandableHeaders() {
  ['training', 'bus'].forEach(function (id) {
    const hdr = document.getElementById('hdr-' + id);
    if (!hdr) return;
    hdr.addEventListener('click', function () {
      toggleExpandableSection(id);
    });
  });
}

function scrollToSectionFromHash() {
  const id = location.hash ? location.hash.slice(1) : '';
  if (!SECTION_IDS.includes(id)) return;
  if (id === 'training' && !state.trainingExpanded) {
    state.trainingExpanded = true;
    applyExpandableSection('training', true);
    saveState();
  }
  if (id === 'bus' && !state.busExpanded) {
    state.busExpanded = true;
    applyExpandableSection('bus', true);
    saveState();
    startBusNearbyAndEta(true);
  }
  const el = document.getElementById(id);
  if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

window.addEventListener('hashchange', scrollToSectionFromHash);

/* ===== Modal ===== */
const backdrop = document.getElementById('modalBackdrop');
const modalPanel = document.getElementById('modalPanel');

function openModal(html) {
  modalPanel.innerHTML = html;
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden', 'false');
  const first = modalPanel.querySelector('input, select, button, textarea');
  if (first) setTimeout(() => first.focus(), 100);
}

function closeModal() {
  backdrop.classList.remove('open');
  backdrop.setAttribute('aria-hidden', 'true');
  modalPanel.innerHTML = '';
}

backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && backdrop.classList.contains('open')) closeModal();
});

function renderShortcuts() {

    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">此分類暫無捷徑</div>';
    return;
  }
  grid.innerHTML = list.map(s => {
    const letter = letterFallback(s.title);
    const fav = faviconUrl(s.url);
    const iconHtml = fav
      ? '<img src="' + escapeHtml(fav) + '" alt="" loading="lazy" data-letter="' + escapeHtml(letter) + '">'
      : escapeHtml(letter);
    return (
      '<div class="sc-item" draggable="true" data-id="' + escapeHtml(s.id) + '" role="link" tabindex="0" title="' + escapeHtml(s.title) + '">' +
        '<button type="button" class="sc-edit-btn" data-edit="' + escapeHtml(s.id) + '" aria-label="編輯">✎</button>' +
        '<div class="sc-icon">' + iconHtml + '</div>' +
        '<div class="sc-title">' + escapeHtml(s.title) + '</div>' +
      '</div>'
    );
  }).join('');

  grid.querySelectorAll('.sc-icon img').forEach(img => {
    img.addEventListener('error', () => {
      const letter = img.getAttribute('data-letter') || '?';
      const parent = img.parentElement;
      if (parent) parent.textContent = letter;
    });
  });

  grid.querySelectorAll('.sc-item').forEach(item => {
    const id = item.getAttribute('data-id');

    item.addEventListener('click', (e) => {
      if (e.target.closest('[data-edit]')) return;
      if (item.classList.contains('dragging')) return;
      const sc = state.shortcuts.find(x => x.id === id);
      if (sc && sc.url) window.open(sc.url, '_blank', 'noopener');
    });
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const sc = state.shortcuts.find(x => x.id === id);
        if (sc && sc.url) window.open(sc.url, '_blank', 'noopener');
      }
    });

    const editBtn = item.querySelector('[data-edit]');
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openShortcutModal(id);
    });

    // Desktop drag
    item.addEventListener('dragstart', (e) => {
      dragId = id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', id); } catch (_) {}
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      grid.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
      dragId = null;
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const from = dragId || e.dataTransfer.getData('text/plain');
      const to = id;
      if (from && to && from !== to) reorderShortcuts(from, to);
    });

    // Touch long-press drag
    let startX, startY, moved = false;
    item.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; moved = false;
      longPressTimer = setTimeout(() => {
        dragId = id;
        item.classList.add('dragging', 'show-edit');
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) {}
      }, 420);
    }, { passive: true });
    item.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
        moved = true;
        if (!dragId) clearTimeout(longPressTimer);
      }
      if (dragId) {
        e.preventDefault();
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const target = el && el.closest('.sc-item');
        grid.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
        if (target && target.getAttribute('data-id') !== dragId) target.classList.add('drag-over');
      }
    }, { passive: false });
    item.addEventListener('touchend', (e) => {
      clearTimeout(longPressTimer);
      if (dragId) {
        const t = e.changedTouches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const target = el && el.closest('.sc-item');
        const to = target && target.getAttribute('data-id');
        if (to && to !== dragId) reorderShortcuts(dragId, to);
        grid.querySelectorAll('.sc-item').forEach(x => x.classList.remove('dragging', 'drag-over'));
        dragId = null;
      } else {
        item.classList.remove('show-edit');
      }
    });
    item.addEventListener('touchcancel', () => {
      clearTimeout(longPressTimer);
      item.classList.remove('dragging', 'show-edit');
      dragId = null;
    });
  });
}

function reorderShortcuts(fromId, toId) {
  const fromIdx = state.shortcuts.findIndex(s => s.id === fromId);
  const toIdx = state.shortcuts.findIndex(s => s.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [item] = state.shortcuts.splice(fromIdx, 1);
  state.shortcuts.splice(toIdx, 0, item);

  renderShortcuts();
}

/* ===== Todos ===== */
function isTodoDueToday(t) {
  const d = parseDateOnly(t && t.due);
  if (!d) return false;
  return daysDiff(d) === 0;
}

function isTodoDueTomorrow(t) {
  const d = parseDateOnly(t && t.due);
  if (!d) return false;
  return daysDiff(d) === 1;
}

function isTodoDueWithinWeek(t) {
  const d = parseDateOnly(t && t.due);
  if (!d) return false;
  const n = daysDiff(d);
  return n >= 0 && n <= 6;
}

function matchesTodoTab(t) {
  const noDue = !(t && t.due);
  if (todoTab === 'week') {
    // No-due items belong on 今日/七天; keep completed visible (strikethrough at bottom)
    if (noDue) return true;
    return isTodoDueWithinWeek(t);
  }
  if (todoTab === 'tomorrow') {
    // 「明天」：只顯示到期日為明天的待辦（不含無到期日）
    if (noDue) return false;
    return isTodoDueTomorrow(t);
  }
  // today (default) — completed stay visible when they belong (no due / due today)
  if (noDue) return true;
  return isTodoDueToday(t);
}

function todosFilterHintText() {
  if (todoTab === 'week') return '顯示七天內的待辦';
  if (todoTab === 'tomorrow') return '顯示明天的待辦';
  return '顯示今天的待辦';
}

  if (fromIdx < 0 || toIdx < 0) return;
  const fromItem = state.todos[fromIdx];
  const toItem = state.todos[toIdx];
  // Only reorder among incomplete items
  if (fromItem.done || toItem.done) return;

  state.todos.splice(toIdx, 0, item);
  saveState();

function bindTodoDnD(row, list) {
  const id = row.getAttribute('data-id');
  row.setAttribute('draggable', 'true');

  row.addEventListener('dragstart', (e) => {
    if (e.target.closest('.todo-check') || e.target.closest('[data-del]') || e.target.closest('[data-edit]')) {
      e.preventDefault();
      return;
    }
    todoDragId = id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (_) {}
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    list.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    todoDragId = null;
  });
  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!row.classList.contains('todo-draggable')) return;
    row.classList.add('drag-over');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    row.classList.remove('drag-over');
    const from = todoDragId || e.dataTransfer.getData('text/plain');
    const to = id;
    if (from && to && from !== to) reorderTodos(from, to);
  });

  let startX, startY;
  row.addEventListener('touchstart', (e) => {
    if (e.target.closest('.todo-check') || e.target.closest('[data-del]') || e.target.closest('[data-edit]')) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    longPressTimer = setTimeout(() => {
      todoDragId = id;
      row.classList.add('dragging');
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) {}
    }, 420);
  }, { passive: true });
  row.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
      if (!todoDragId) clearTimeout(longPressTimer);
    }
    if (todoDragId) {
      e.preventDefault();
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('.todo-item.todo-draggable');
      list.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
      if (target && target.getAttribute('data-id') !== todoDragId) target.classList.add('drag-over');
    }
  }, { passive: false });
  row.addEventListener('touchend', (e) => {
    clearTimeout(longPressTimer);
    if (todoDragId) {
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('.todo-item.todo-draggable');
      const to = target && target.getAttribute('data-id');
      if (to && to !== todoDragId) reorderTodos(todoDragId, to);
      list.querySelectorAll('.todo-item').forEach(x => x.classList.remove('dragging', 'drag-over'));
      todoDragId = null;
    }
  });
  row.addEventListener('touchcancel', () => {
    clearTimeout(longPressTimer);
    row.classList.remove('dragging');
    todoDragId = null;
  });
}

function renderTodos() {
  const list = document.getElementById('todoList');
  // Preserve state.todos order; incompletes first, completed at bottom
  const filtered = state.todos.filter(matchesTodoTab);
  const openItems = filtered.filter(t => !t.done);
  const doneItems = filtered.filter(t => t.done);
  const items = openItems.concat(doneItems);

  if (!items.length) {
    let emptyMsg = '今天暫無待辦，輕鬆一下吧';
    if (todoTab === 'week') emptyMsg = '七天內暫無待辦';
    else if (todoTab === 'tomorrow') emptyMsg = '明天暫無待辦';
    list.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
    return;
  }
  let openOrd = 0;
  list.innerHTML = items.map(t => {
    const d = parseDateOnly(t.due);
    const dd = daysDiff(d);
    const dragCls = t.done ? '' : ' todo-draggable';
    const ord = t.done ? 0 : (++openOrd);
    const numHtml = t.done
      ? ''
      : '<span class="todo-num" aria-label="次序 ' + ord + '">' + ord + '</span>';
    return (
      '<div class="todo-item' + (t.done ? ' done' : '') + dragCls + '" data-id="' + escapeHtml(t.id) + '">' +
        numHtml +
        '<input type="checkbox" class="todo-check" ' + (t.done ? 'checked' : '') + ' aria-label="完成" />' +
        '<div class="todo-body">' +
          '<div class="todo-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="meta">' +
            (t.due ? '<span>' + escapeHtml(t.due) + '</span>' + formatDays(dd) : '<span>無到期日</span>') +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-icon" data-edit aria-label="編輯">✎</button>' +
        '<button type="button" class="btn btn-icon" data-del aria-label="刪除">🗑</button>' +
      '</div>'
    );
  }).join('');

  list.querySelectorAll('.todo-item').forEach(row => {
    const id = row.getAttribute('data-id');
    row.querySelector('.todo-check').addEventListener('change', (e) => {
      const t = state.todos.find(x => x.id === id);
      if (!t) return;
      t.done = e.target.checked;
      t.updatedAt = Date.now();
      // Keep relative order in state.todos; render puts done at bottom
      saveState();
      renderTodos();
    });
    row.querySelector('[data-edit]').addEventListener('click', (e) => {
      e.stopPropagation();
      openTodoEditModal(id);
    });
    row.querySelector('[data-del]').addEventListener('click', () => {
      state.todos = state.todos.filter(x => x.id !== id);
      saveState();
      renderTodos();
    });
    if (row.classList.contains('todo-draggable')) bindTodoDnD(row, list);
  });
}

function sortEventsNearestFirst(list) {
  const today = todayLocal();
  return list.slice().sort((a, b) => {
    const da = parseDateOnly(a.date);
    const db = parseDateOnly(b.date);
    const aPast = da ? da < today : true;
    const bPast = db ? db < today : true;
    if (aPast !== bPast) return aPast ? 1 : -1; // upcoming first, past at end
    const cmpDate = String(a.date || '').localeCompare(String(b.date || ''));
    if (cmpDate) return aPast ? -cmpDate : cmpDate; // upcoming asc; past desc-ish via date
    const ta = a.time || '99:99';
    const tb = b.time || '99:99';
    return ta.localeCompare(tb);
  });
}

function renderEvents() {
  try {
    const before = (state.events || []).length;
    state.events = dedupeEventsByTitleDate(state.events || []);
    if ((state.events || []).length !== before) saveState();
  } catch (e) {}

  const list = document.getElementById('eventList');
  // Normalize / migrate legacy from/to → date/time/work
  let dirty = false;
